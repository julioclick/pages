  mount(){ this.charts(this.base, this.base); },

  onSlide(id, el){
    const min = +el.min, max = +el.max, v = +el.value;
    el.style.setProperty('--pct', ((v-min)/(max-min)*100).toFixed(1)+'%');
    UI.el('#v_'+id).textContent = UI.nb(v);
    UI.el('#cenarioBadge').textContent = 'Cenário modificado';
    UI.el('#cenarioBadge').className = 'badge b-warn';
  },

  lerCenario(){
    return {
      caminhoes:+UI.el('#s_caminhoes').value, docas:+UI.el('#s_docas').value,
      equipe:+UI.el('#s_equipe').value, volume:+UI.el('#s_volume').value, pedidos:+UI.el('#s_pedidos').value,
    };
  },

  /* Modelo simplificado de projeção — coerente e determinístico */
  projetar(c){
    const b = this.base;
    const capVeic = c.caminhoes / b.caminhoes;
    const capDoca = c.docas / b.docas;
    const capEqp  = c.equipe / b.equipe;
    const demanda = (c.volume / b.volume) * 0.6 + (c.pedidos / b.pedidos) * 0.4;
    const capacidade = capVeic * 0.4 + capDoca * 0.33 + capEqp * 0.27;
    const folga = capacidade / demanda;                       // >1 sobra capacidade
    const otif = Math.max(78, Math.min(99.2, 96.4 * Math.pow(folga, 0.34)));
    const ciclo = 8.7 / Math.pow(folga, 0.42);
    const custoUnit = 128.4 * (1 + (1 - Math.min(folga,1.35)) * 0.42) * (folga > 1.12 ? 1 + (folga - 1.12) * 0.3 : 1);
    const volAno = c.volume * 300;
    const econ = Math.max(0.4, (162 - custoUnit) / 162 * 9.4 * (c.volume / b.volume));
    const invest = 1.18 * (0.72 + capDoca * 0.16 + capEqp * 0.12);
    const roi = (econ - invest) / invest * 100;
    return { otif, ciclo, custoUnit, econ, invest, roi, folga, capacidade, demanda };
  },

  simular(){
    const c = this.lerCenario();
    UI.aiRun(UI.el('#simResults'), [
      'Carregando 18 meses de histórico da operação…',
      'Calibrando o modelo de capacidade e filas…',
      'Executando 10.000 simulações de Monte Carlo…',
      'Projetando custo, nível de serviço e ROI…',
      'Redigindo a interpretação executiva…',
    ], ()=>{
      const p = this.projetar(c);
      const fmtCiclo = h => Math.floor(h) + 'h' + String(Math.round((h%1)*60)).padStart(2,'0');

      UI.el('#sim_econ').textContent  = 'R$ ' + p.econ.toFixed(2).replace('.',',') + ' mi';
      UI.el('#sim_ciclo').textContent = fmtCiclo(p.ciclo);
      UI.el('#sim_otif').textContent  = p.otif.toFixed(1).replace('.',',') + '%';
      UI.el('#sim_roi').textContent   = Math.round(p.roi) + '%';

      const gargalo = p.folga < 1
        ? (c.docas/this.base.docas < c.caminhoes/this.base.caminhoes ? 'nas <b>docas</b>' : 'na <b>frota</b>')
        : null;

      UI.el('#simText').innerHTML = p.folga < 0.97
        ? `Cenário <b>subdimensionado</b>. Com ${UI.nb(c.volume)} volumes e ${UI.nb(c.pedidos)} pedidos por dia,
           a capacidade instalada cobre apenas <span class="hi">${(p.folga*100).toFixed(0)}%</span> da demanda —
           o gargalo estrutural está ${gargalo}. O OTIF projetado cai para <span class="hi">${p.otif.toFixed(1).replace('.',',')}%</span>,
           o ciclo sobe para <b>${fmtCiclo(p.ciclo)}</b> e o custo por tonelada vai a
           <b>R$ ${p.custoUnit.toFixed(2).replace('.',',')}</b>. Recomendo elevar o recurso limitante antes de assumir esse volume.`
        : p.folga > 1.22
        ? `Cenário <b>superdimensionado</b>. A capacidade excede a demanda em <span class="hi">${((p.folga-1)*100).toFixed(0)}%</span>,
           o que garante OTIF de <b>${p.otif.toFixed(1).replace('.',',')}%</b> mas eleva o custo fixo por tonelada para
           <b>R$ ${p.custoUnit.toFixed(2).replace('.',',')}</b>. Há recurso ocioso pago:
           reduzir veículos ou remanejar equipe libera caixa sem perda de serviço.
           Economia anual projetada: <span class="money">R$ ${p.econ.toFixed(2).replace('.',',')} milhões</span>, com ROI de <b>${Math.round(p.roi)}%</b>.`
        : `Cenário <b>equilibrado</b> — o melhor ponto entre custo e serviço. A capacidade cobre
           <span class="hi">${(p.folga*100).toFixed(0)}%</span> da demanda, o OTIF projetado é de
           <b>${p.otif.toFixed(1).replace('.',',')}%</b>, o ciclo médio fica em <b>${fmtCiclo(p.ciclo)}</b> e o custo por tonelada em
           <b>R$ ${p.custoUnit.toFixed(2).replace('.',',')}</b>. Economia anual projetada de
           <span class="money">R$ ${p.econ.toFixed(2).replace('.',',')} milhões</span>, investimento de
           <span class="money">R$ ${p.invest.toFixed(2).replace('.',',')} milhões</span> e ROI de <b>${Math.round(p.roi)}%</b> em 12 meses.`;

      this.charts(c, p);
      UI.el('#cenarioBadge').textContent = 'Cenário simulado';
      UI.el('#cenarioBadge').className = 'badge b-ok';
      UI.toast('Simulação concluída',
        `OTIF ${p.otif.toFixed(1).replace('.',',')}% · ciclo ${fmtCiclo(p.ciclo)} · economia R$ ${p.econ.toFixed(2).replace('.',',')} mi/ano · ROI ${Math.round(p.roi)}%.`,'ai');
    }, 3000);
  },

  charts(c, p){
    const econ = p.econ || 4.86;
    const serie = DB.meses.map((_,i)=> (econ*1000/12)*(i+1) * (1 + i*0.012));
    UI.chart('chSim', {
      type:'line',
      data:{ labels:['M1','M2','M3','M4','M5','M6','M7','M8','M9','M10','M11','M12'], datasets:[
        { label:'Cenário simulado (R$ mil)', data:serie, borderColor:'#8B5CF6', borderWidth:2.8, tension:.4,
          backgroundColor:'rgba(139,92,246,.18)', fill:true, pointRadius:0, pointHoverRadius:5 },
        { label:'Operação atual (R$ mil)', data:DB.serieEconomia, borderColor:'#6366F1', borderWidth:2,
          borderDash:[6,5], tension:.4, fill:false, pointRadius:0 },
      ]},
      options:{ plugins:{ legend:{ position:'top', align:'end' } },
        scales:{ y:{ ticks:{ callback:v=>'R$ '+UI.nb(v)+'k' } }, x:{ grid:{ display:false } } } }
    });

    const cap = p.capacidade || 1, dem = p.demanda || 1;
    UI.chart('chCap', {
      type:'bar',
      data:{ labels:['Frota','Docas','Equipe','Demanda'],
        datasets:[{ label:'Índice de capacidade (base 100)',
          data:[ (c.caminhoes/this.base.caminhoes*100), (c.docas/this.base.docas*100),
                 (c.equipe/this.base.equipe*100), dem*100 ],
          borderRadius:8, borderSkipped:false,
          backgroundColor:['rgba(99,102,241,.85)','rgba(34,211,238,.85)','rgba(139,92,246,.85)','rgba(245,158,11,.85)'] }]},
      options:{ plugins:{ legend:{ display:false },
        tooltip:{ callbacks:{ label:c2=>`Índice ${c2.parsed.y.toFixed(0)} (base 100 = hoje)` } } },
        scales:{ x:{ grid:{ display:false } } } }
    });
  },

  reset(){
    const b = this.base;
    Object.entries(b).forEach(([k,v])=>{
      const el = UI.el('#s_'+k); if(!el) return;
      el.value = v; this.onSlide(k, el);
    });
    UI.el('#cenarioBadge').textContent = 'Cenário base';
    UI.el('#cenarioBadge').className = 'badge b-brand';
    UI.toast('Cenário restaurado','As variáveis voltaram à configuração real da operação.','info','rotate-ccw');
  },
};

/* ══════════════════════════════════════════════════════════════
   10 · CONFIGURAÇÕES E INTEGRAÇÕES

Views.config = {
  title:'Configurações & Integrações', mod:'Plataforma',

    <div class="grid g4 stagger" style="gap:15px;margin-bottom:18px">
      ${[['Integrações ativas','11','plug','#10B981','de 12 configuradas'],
         ['Registros sincronizados','6,4 M','database','#6366F1','nas últimas 24 horas'],
         ['Disponibilidade','99,98%','activity','#22D3EE','SLA contratado: 99,9%'],
         ['Modelos em produção','11','brain-circuit','#8B5CF6','acurácia média 93,3%']]
        .map(([l,v,i,c,s])=>`<div class="kpi" style="--kpi-glow:${c}44;--kpi-c:${c};--kpi-bg:${c}22;--kpi-bd:${c}44">
          <div class="kpi-top"><div class="kpi-lbl">${l}</div><div class="kpi-ico"><i data-lucide="${i}"></i></div></div>
          <div class="kpi-val" style="font-size:25px">${v}</div>
          <div class="kpi-sub"><span>${s}</span></div>
        </div>`).join('')}
    </div>

    <div class="grid" style="grid-template-columns:1.35fr 1fr;gap:18px;margin-bottom:18px">
      <div class="card">
        <div class="card-h">
          <div><h3>Ecossistema conectado</h3><div class="sub">ERPs, WMS, TMS, nuvem e plataformas de dados</div></div>
          <span class="badge b-ok">11 conectados</span>
        </div>
        <div class="card-b" style="display:flex;flex-direction:column;gap:11px;max-height:640px;overflow-y:auto">${integ}</div>

      <div class="col" style="gap:18px">
        <div class="card">
          <div class="card-h"><div><h3>Políticas de automação</h3><div class="sub">Até onde a IA pode decidir sozinha</div></div></div>
          <div class="card-b" style="display:flex;flex-direction:column;gap:15px">
            ${[['Reprogramar janelas de doca','Automático até 60 min de deslocamento',true],
               ['Reotimizar rotas em trânsito','Automático se a economia superar R$ 500',true],
               ['Consolidar cargas fracionadas','Requer aprovação do planejador',false],
               ['Acionar fornecedor alternativo','Requer aprovação de suprimentos',false],
               ['Notificar motoristas e transportadoras','Automático, sempre',true],
               ['Bloquear faturamento por divergência','Automático, sempre',true]]
              .map(([t,d,on])=>`
              <div class="row" style="gap:13px">
                <div class="grow"><div style="font-size:12.8px;font-weight:600">${t}</div>
                  <div class="tiny dim" style="margin-top:2px">${d}</div></div>
                <div class="switch ${on?'on':''}" onclick="Views.config.toggle(this,'${t}')"></div>
              </div>`).join('')}
          </div>
        </div>

        <div class="card">
          <div class="card-h"><div><h3>Preferências da conta</h3><div class="sub">Ricardo Alencar · Diretor de Supply Chain</div></div></div>
          <div class="card-b" style="display:flex;flex-direction:column;gap:15px">
            <div class="row"><div class="grow"><div style="font-size:12.8px;font-weight:600">Tema escuro</div>
              <div class="tiny dim">Reduz fadiga visual em salas de controle</div></div>
              <div class="switch ${UI.isDark()?'on':''}" onclick="App.toggleTheme();this.classList.toggle('on')"></div></div>
            <div class="row"><div class="grow"><div style="font-size:12.8px;font-weight:600">Briefing diário por e-mail</div>
              <div class="tiny dim">Todo dia útil às 06:30</div></div>
              <div class="switch on" onclick="this.classList.toggle('on')"></div></div>
            <div class="row"><div class="grow"><div style="font-size:12.8px;font-weight:600">Alertas críticos no WhatsApp</div>
              <div class="tiny dim">Apenas severidade crítica</div></div>
              <div class="switch on" onclick="this.classList.toggle('on')"></div></div>
            <div class="row"><div class="grow"><div style="font-size:12.8px;font-weight:600">Modo apresentação</div>
              <div class="tiny dim">Oculta dados sensíveis em telas compartilhadas</div></div>
              <div class="switch" onclick="this.classList.toggle('on')"></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-h">
        <div><h3>Modelos de IA em produção</h3><div class="sub">Versão, acurácia em backtest e volume de inferências</div></div>
        <span class="badge b-brand"><i data-lucide="sparkles"></i>MLOps via Databricks</span>
      </div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Modelo</th><th>Versão</th><th>Acurácia</th><th class="r">Inferências</th><th class="r">Ambiente</th></tr></thead>
        <tbody>${modelos}</tbody>
      </table></div>
      <div class="card-f">
        <div class="row wrap" style="gap:20px">
          <span class="row tiny dim" style="gap:6px"><i data-lucide="shield-check" style="width:12px;height:12px;color:var(--ok)"></i>Dados processados no tenant do cliente</span>
          <span class="row tiny dim" style="gap:6px"><i data-lucide="lock" style="width:12px;height:12px"></i>Criptografia AES-256 em repouso e TLS 1.3 em trânsito</span>
          <span class="row tiny dim" style="gap:6px"><i data-lucide="file-check" style="width:12px;height:12px"></i>Aderente à LGPD · trilha de auditoria completa</span>
          <span class="row tiny dim" style="gap:6px"><i data-lucide="badge-check" style="width:12px;height:12px"></i>ISO 27001 · SOC 2 Type II</span>
        </div>
      </div>
    </div>`;
  },

  mount(){ UI.animateBars(); },

  toggle(el, nome){
    el.classList.toggle('on');
    const on = el.classList.contains('on');
    UI.toast(on ? 'Recurso ativado' : 'Recurso desativado',
      `<b>${nome}</b> foi ${on?'ativado':'desativado'}. A alteração vale a partir do próximo ciclo de sincronização.`,
      on ? 'ok' : 'warn', on ? 'check-circle-2' : 'power-off');
  },
};
</script>


<script>
/* ══════════════════════════════════════════════
   CAMADA 4 · APP — núcleo, roteamento e shell
   ══════════════════════════════════════════════ */
const App = {
  atual:null,

  /* ---- Inicialização ---- */
  init(){
    UI.chartDefaults();
    this.renderNav();
    this.renderNotif();
    this.bindAtalhos();
    this.go('dashboard', true);
    UI.icons();

    setTimeout(()=>UI.toast('Sincronização concluída',
      '1.284.902 eventos processados de SAP, WMS, TMS e telemetria da frota nos últimos 60 segundos.','ok','database'), 1400);
    setTimeout(()=>UI.toast('3 decisões críticas aguardam você',
      'A IA preparou plano de ação para cada uma. Impacto financeiro combinado: R$ 389.200.','ai'), 4200);
  },

  /* ---- Menu lateral ---- */
  renderNav(){
    UI.el('#nav').innerHTML = DB.nav.map(n=>{
      if (n.sec) return `<div class="sb-sec-title up">${n.sec}</div>`;
      return `<div class="sb-item" data-id="${n.id}" onclick="App.go('${n.id}')" data-tip="${n.label}">
        <i data-lucide="${n.icon}"></i>
        <span class="sb-label">${n.label}</span>
        ${n.badge ? `<span class="sb-badge ${n.soft?'soft':''}">${n.badge}</span>` : ''}
      </div>`;
    }).join('');
  },

  /* ---- Painel de notificações ---- */
  renderNotif(){
    UI.el('#notifPanel').innerHTML = `
      <div class="card-h" style="padding:15px 17px">
        <div><h3 style="font-size:13.5px">Central de notificações</h3>
          <div class="sub">7 não lidas · 2 críticas</div></div>
        <button class="btn btn-sm btn-ghost" onclick="App.lerTudo(event)">Marcar lidas</button>
      </div>
      <div style="max-height:400px;overflow-y:auto">
        ${DB.notificacoes.map(n=>`
          <div class="notif-item" onclick="UI.toast('${n.t}','${n.d}','${n.sev}')">
            <span class="dot dot-${n.sev==='info'?'ok':n.sev} ${n.sev==='crit'?'dot-live':''}" style="margin-top:6px"></span>
            <div class="grow"><h6>${n.t}</h6><p>${n.d}</p><div class="tm">${n.tm}</div></div>
          </div>`).join('')}
      </div>
      <div class="card-f" style="padding:11px 17px">
        <button class="btn btn-sm" style="width:100%" onclick="App.go('torre');App.toggleNotif(event)">
          <i data-lucide="radar"></i>Abrir Torre de Controle</button>
      </div>`;
  },

  /* ---- Roteamento ---- */
  go(id, first=false){
    if (this.atual === id) { this.closeMobile(); return; }
    const view = Views[id]; if (!view) return;

    // Encerra timers da tela anterior
    if (this.atual && Views[this.atual]?.timer) clearInterval(Views[this.atual].timer);
    UI.destroyCharts();
    this.atual = id;

    // Estado do menu
    UI.els('.sb-item').forEach(i=>i.classList.toggle('active', i.dataset.id === id));
    UI.el('#crumb-mod').textContent = view.mod;
    UI.el('#crumb-page').textContent = view.title;
    document.title = `${view.title} · SupplyMind AI`;

    const content = UI.el('#content');

    const paint = ()=>{
      content.innerHTML = `<div class="view active">${view.render()}</div>`;
      UI.icons();
      view.mount && view.mount();
      window.scrollTo({ top:0, behavior:first ? 'auto' : 'smooth' });
      this.closeMobile();
    };

    if (first){ paint(); return; }

    // Skeleton de carregamento entre telas
    content.innerHTML = `
      <div class="skeleton-wrap" style="animation:fadeIn .2s var(--ease)">
        <div class="sk sk-line" style="width:280px;height:26px;margin-bottom:12px"></div>
        <div class="sk sk-line" style="width:460px;height:13px;margin-bottom:26px"></div>
        <div class="grid g4" style="gap:16px;margin-bottom:18px">
          ${Array.from({length:4},()=>`<div class="sk" style="height:132px;border-radius:22px"></div>`).join('')}
        </div>
        <div class="sk" style="height:96px;border-radius:22px;margin-bottom:18px"></div>
        <div class="grid" style="grid-template-columns:1.4fr 1fr;gap:18px">
          <div class="sk" style="height:340px;border-radius:22px"></div>
          <div class="sk" style="height:340px;border-radius:22px"></div>
        </div>
      </div>`;
    setTimeout(paint, 480);
  },

  /* ---- Detalhe de insight (drawer) ---- */
  openInsight(enc){
    const o = JSON.parse(decodeURIComponent(enc));
    this.drawer(o.title, `Insight gerado pela IA · ${o.conf}% de confiança`, `
      <div class="ai-strip" style="margin-bottom:20px"><div class="ai-strip-in">
        <div class="ai-orb"><i data-lucide="${o.icon}"></i></div>
        <div class="grow"><div class="ai-title">O que a IA encontrou</div>
          <div class="ai-body">${o.txt}</div></div>
      </div></div>

      <div class="grid g2" style="gap:13px;margin-bottom:20px">
        <div style="padding:16px;border-radius:15px;background:var(--panel);border:1px solid var(--stroke)">
          <div class="row" style="gap:8px;margin-bottom:8px"><i data-lucide="banknote" style="width:14px;height:14px;color:var(--ok)"></i>
            <span class="tiny dim">Impacto financeiro</span></div>
          <div style="font-size:14.5px;font-weight:650">${o.impact}</div>
        </div>
        <div style="padding:16px;border-radius:15px;background:var(--panel);border:1px solid var(--stroke)">
          <div class="row" style="gap:8px;margin-bottom:8px"><i data-lucide="gauge" style="width:14px;height:14px;color:var(--brand-300)"></i>
            <span class="tiny dim">Confiança do modelo</span></div>
          <div style="font-size:14.5px;font-weight:650">${o.conf}% · backtest de 18 meses</div>
        </div>
      </div>

      <h4 style="margin:0 0 12px;font-size:13px">Plano de ação recomendado</h4>
      <div class="col" style="gap:10px">
        ${[[o.action,'Ação principal · aplicação imediata'],
           ['Notificar as partes envolvidas','Motoristas, transportadoras e planejamento por WhatsApp e EDI'],
           ['Monitorar o efeito por 4 horas','A IA reavalia a cada 15 minutos e reverte se necessário']]
          .map(([t,d],i)=>`
          <div class="queue-item"><div class="q-pos ${i===0?'p1':''}">${i+1}</div>
            <div class="grow"><div style="font-size:12.6px;font-weight:600">${t}</div>
              <div class="tiny dim" style="margin-top:2px">${d}</div></div></div>`).join('')}
      </div>

      <h4 style="margin:22px 0 12px;font-size:13px">Fontes consultadas</h4>
      <div class="row wrap" style="gap:7px">
        ${['SAP S/4HANA','WMS Meridiano','TMS Roadmap','Telemetria da frota','Google Maps Traffic','INMET']
          .map(s=>`<span class="src"><i data-lucide="database"></i>${s}</span>`).join('')}
      </div>`,
      `<button class="btn" onclick="App.closeDrawer()">Descartar</button>
       <button class="btn btn-ai" onclick="App.aplicarInsight()"><i data-lucide="zap"></i>Aplicar recomendação</button>`);
  },

  aplicarInsight(){
    this.closeDrawer();
    UI.toast('Recomendação aplicada','As ações foram enviadas aos módulos responsáveis. A IA monitora o efeito e reverte automaticamente se o resultado divergir da projeção.','ok','zap');
  },

  /* ---- Drawer ---- */
  drawer(title, sub, body, footer=''){
    UI.el('#drawer').innerHTML = `
      <div class="drawer-h">
        <div><h3 style="font-size:16px">${title}</h3><div class="sub tiny dim" style="margin-top:3px">${sub}</div></div>
        <button class="btn btn-icon btn-ghost" onclick="App.closeDrawer()"><i data-lucide="x"></i></button>
      </div>
      <div class="drawer-b">${body}</div>
      ${footer ? `<div class="drawer-f">${footer}</div>` : ''}`;
    UI.el('#scrim').classList.add('on');
    UI.el('#drawer').classList.add('on');
    UI.icons();
  },
  closeDrawer(){
    UI.el('#scrim').classList.remove('on');
    UI.el('#drawer').classList.remove('on');
  },

  /* ---- Tema ---- */
  toggleTheme(){
    const root = document.documentElement;
    const novo = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = novo;
    UI.chartDefaults();
    // Redesenha a tela para atualizar cores dos gráficos
    const atual = this.atual; this.atual = null; this.go(atual, true);
    UI.toast(novo === 'dark' ? 'Tema escuro ativado' : 'Tema claro ativado',
      novo === 'dark' ? 'Otimizado para salas de controle e uso prolongado.' : 'Otimizado para apresentações e ambientes claros.',
      'info','sun-moon');
  },

  /* ---- Sidebar ---- */
  toggleSidebar(){
    const app = UI.el('#app');
    app.classList.toggle('collapsed');
    const btn = UI.el('.sb-toggle-desk');
    const atual = btn?.querySelector('i,svg');
    if (atual){
      const novo = document.createElement('i');
      novo.setAttribute('data-lucide', app.classList.contains('collapsed') ? 'panel-left-open' : 'panel-left-close');
      atual.replaceWith(novo);
    }
    UI.icons();
  },
  toggleMobile(){ UI.el('#app').classList.toggle('mobile-open'); },
  closeMobile(){ UI.el('#app').classList.remove('mobile-open'); },

  /* ---- Notificações ---- */
  toggleNotif(e){
    e && e.stopPropagation();
    UI.el('#notifPanel').classList.toggle('on');
    UI.icons();
  },
  lerTudo(e){
    e.stopPropagation();
    UI.el('#notifCount').style.display = 'none';
    UI.toast('Notificações marcadas como lidas','As 2 notificações críticas permanecem ativas na Torre de Controle até serem resolvidas.','info','check-check');
  },

  /* ---- Busca e atalhos ---- */
  bindAtalhos(){
    document.addEventListener('keydown', e=>{
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
        e.preventDefault(); UI.el('#globalSearch').focus();
      }
      if (e.key === 'Escape'){ this.closeDrawer(); UI.el('#notifPanel').classList.remove('on'); }
    });

    UI.el('#globalSearch').addEventListener('keydown', e=>{
      if (e.key !== 'Enter') return;
      const q = e.target.value.trim(); if (!q) return;
      const mapa = [
        [/doca|fila|janela|agendamento|pátio/i, 'docas'],
        [/rota|roteiriz|frete|combust|motorista/i, 'rotas'],
        [/carga|descarga|equipe|empilhad|produtiv/i, 'operacoes'],
        [/fracion|consolid|cubagem|volume/i, 'fracionamento'],
        [/torre|alerta|evento|risco/i, 'torre'],
        [/analytic|kpi|indicador|otif|benchmark|ranking/i, 'analytics'],
        [/simul|cenário|cenario|roi/i, 'simulador'],
        [/integra|sap|totvs|oracle|fabric|databricks|config/i, 'config'],
        [/ia|agente|copiloto|pergunt/i, 'agente'],
      ];
      const achou = mapa.find(([re])=>re.test(q));
      UI.toast('Busca inteligente',
        `<b>"${q}"</b> — a IA encontrou correspondências em ${achou ? '3' : '5'} módulos e abriu o mais relevante.`, 'ai');
      this.go(achou ? achou[1] : 'analytics');
      e.target.value = '';
    });

    document.addEventListener('click', e=>{
      if (!e.target.closest('.bell') && !e.target.closest('#notifPanel'))
        UI.el('#notifPanel')?.classList.remove('on');
    });
  },
};

/* ---- Boot ---- */
document.addEventListener('DOMContentLoaded', ()=>App.init());
</script>
</body>
</html>
