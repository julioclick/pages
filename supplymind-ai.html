<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SupplyMind AI — Centro de Comando Logístico Inteligente</title>
<meta name="description" content="SupplyMind AI — a primeira plataforma de IA que atua como Centro de Comando Inteligente para toda a operação logística." />

<!-- ═══════════════ FONTES ═══════════════ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<!-- ═══════════════ BIBLIOTECAS ═══════════════ -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<style>
/* ════════════════════════════════════════════════════════════════════
   SUPPLYMIND AI · DESIGN SYSTEM
   1. Tokens        2. Reset        3. Primitivos
   4. Shell         5. Componentes  6. Módulos
   7. Animações     8. Responsivo
   ════════════════════════════════════════════════════════════════════ */

/* ─────────── 1. TOKENS ─────────── */
:root{
  /* Marca */
  --brand-50:#EEF0FF; --brand-300:#A5B0FF; --brand:#6366F1; --brand-600:#4F46E5; --brand-700:#4338CA;
  --violet:#8B5CF6; --cyan:#22D3EE; --teal:#2DD4BF; --pink:#EC4899;
  /* Semânticos */
  --ok:#10B981; --ok-soft:rgba(16,185,129,.14);
  --warn:#F59E0B; --warn-soft:rgba(245,158,11,.14);
  --crit:#F43F5E; --crit-soft:rgba(244,63,94,.14);
  --info:#38BDF8; --info-soft:rgba(56,189,248,.14);
  /* Geometria */
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-full:999px;
  --sb-w:264px; --sb-w-collapsed:78px; --topbar-h:68px;
  /* Movimento */
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1);
  --t-fast:.16s; --t:.28s; --t-slow:.55s;
  /* Tipografia */
  --f-display:'Sora',system-ui,sans-serif;
  --f-body:'Inter',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
}

/* Tema escuro (padrão) */
[data-theme="dark"]{
  --bg:#05070F;
  --bg-grad-1:rgba(99,102,241,.16);
  --bg-grad-2:rgba(34,211,238,.10);
  --bg-grad-3:rgba(139,92,246,.12);
  --panel:rgba(255,255,255,.035);
  --panel-2:rgba(255,255,255,.055);
  --panel-solid:#0C101D;
  --glass:rgba(16,20,34,.62);
  --stroke:rgba(255,255,255,.075);
  --stroke-2:rgba(255,255,255,.13);
  --txt:#EEF1FA;
  --txt-2:#A9B2CA;
  --txt-3:#6C769291;
  --txt-dim:#78829C;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 18px 40px -18px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.35);
  --shadow-lg:0 40px 90px -30px rgba(0,0,0,.9);
  --grid-line:rgba(255,255,255,.055);
  --chart-grid:rgba(255,255,255,.06);
  --map-land:rgba(255,255,255,.055);
  --map-stroke:rgba(165,176,255,.35);
}
/* Tema claro */
[data-theme="light"]{
  --bg:#F4F6FC;
  --bg-grad-1:rgba(99,102,241,.13);
  --bg-grad-2:rgba(34,211,238,.11);
  --bg-grad-3:rgba(139,92,246,.10);
  --panel:rgba(255,255,255,.78);
  --panel-2:rgba(255,255,255,.95);
  --panel-solid:#FFFFFF;
  --glass:rgba(255,255,255,.78);
  --stroke:rgba(16,24,56,.09);
  --stroke-2:rgba(16,24,56,.16);
  --txt:#0D1226;
  --txt-2:#48526E;
  --txt-3:#8A93AC;
  --txt-dim:#5B6480;
  --shadow-sm:0 1px 2px rgba(16,24,56,.06);
  --shadow:0 18px 40px -20px rgba(16,24,56,.28), 0 2px 8px rgba(16,24,56,.06);
  --shadow-lg:0 40px 90px -34px rgba(16,24,56,.35);
  --grid-line:rgba(16,24,56,.06);
  --chart-grid:rgba(16,24,56,.08);
  --map-land:rgba(99,102,241,.09);
  --map-stroke:rgba(79,70,229,.4);
}

/* ─────────── 2. RESET ─────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--f-body);
  background:var(--bg); color:var(--txt);
  font-size:14px; line-height:1.55;
  min-height:100vh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background var(--t) var(--ease), color var(--t) var(--ease);
}
/* Fundo ambiente com gradientes de profundidade */
body::before{
  content:''; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(1100px 700px at 12% -8%, var(--bg-grad-1), transparent 62%),
    radial-gradient(900px 620px at 96% 4%, var(--bg-grad-2), transparent 58%),
    radial-gradient(1000px 800px at 62% 108%, var(--bg-grad-3), transparent 60%);
  transition:opacity var(--t) var(--ease);
}
body::after{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 78%);
}
h1,h2,h3,h4,h5{font-family:var(--f-display);font-weight:600;letter-spacing:-.021em;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
ul{list-style:none}
table{border-collapse:collapse;width:100%}
svg{display:block}
::selection{background:rgba(99,102,241,.4);color:#fff}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* Scrollbar */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--stroke-2);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--txt-3);background-clip:padding-box}

/* ─────────── 3. PRIMITIVOS ─────────── */
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.muted{color:var(--txt-2)}
.dim{color:var(--txt-dim)}
.tiny{font-size:11px}
.sm{font-size:12.5px}
.up{text-transform:uppercase;letter-spacing:.09em;font-size:10.5px;font-weight:700;color:var(--txt-dim)}
.row{display:flex;align-items:center;gap:10px}
.row-b{display:flex;align-items:center;justify-content:space-between;gap:12px}
.col{display:flex;flex-direction:column}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.center{display:flex;align-items:center;justify-content:center}
.gradient-text{
  background:linear-gradient(100deg,var(--brand-300),var(--cyan) 45%,var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
[data-theme="light"] .gradient-text{background:linear-gradient(100deg,var(--brand-600),#0891B2 48%,var(--violet));-webkit-background-clip:text;background-clip:text}

/* Botões */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:38px;padding:0 16px;border-radius:var(--r-sm);
  font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;
  border:1px solid var(--stroke);background:var(--panel);color:var(--txt);
  transition:all var(--t-fast) var(--ease);position:relative;overflow:hidden;
}
.btn{-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--panel-2);border-color:var(--stroke-2);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.985)}
.btn svg{width:15px;height:15px;stroke-width:2.1}
.btn-primary{
  background:linear-gradient(135deg,var(--brand-600),var(--violet));
  border-color:transparent;color:#fff;
  box-shadow:0 8px 24px -8px rgba(99,102,241,.75), inset 0 1px 0 rgba(255,255,255,.22);
}
/* IMPORTANTE: reafirmar o gradiente em hover/active/focus.
   `.btn:hover` tem especificidade maior que `.btn-primary` e, sem estas regras,
   sobrescreveria o preenchimento por --panel-2 (branco no tema claro). */
.btn-primary:hover,.btn-primary:active,.btn-primary:focus{
  background:linear-gradient(135deg,var(--brand-600),var(--violet));
  border-color:transparent;color:#fff;
}
.btn-primary:hover{filter:brightness(1.1);box-shadow:0 12px 30px -8px rgba(99,102,241,.9), inset 0 1px 0 rgba(255,255,255,.28)}
.btn-ai{
  background:linear-gradient(135deg,#4F46E5,#8B5CF6 45%,#22D3EE);
  background-size:200% 200%;border-color:transparent;color:#fff;
  box-shadow:0 8px 26px -8px rgba(139,92,246,.8), inset 0 1px 0 rgba(255,255,255,.25);
  animation:gradShift 7s var(--ease-in-out) infinite;
}
.btn-ai:hover,.btn-ai:active,.btn-ai:focus{
  background:linear-gradient(135deg,#4F46E5,#8B5CF6 45%,#22D3EE);
  background-size:200% 200%;border-color:transparent;color:#fff;
}
.btn-ai:hover{filter:brightness(1.08);box-shadow:0 12px 32px -8px rgba(139,92,246,.95), inset 0 1px 0 rgba(255,255,255,.3)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--txt-2)}
.btn-ghost:hover,.btn-ghost:active{background:var(--panel-2);color:var(--txt);border-color:transparent}
.btn-sm{height:31px;padding:0 12px;font-size:12px;border-radius:9px}
.btn-sm svg{width:13px;height:13px}
.btn-icon{width:38px;padding:0}
.btn-icon.btn-sm{width:31px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

/* Badges & Pills */
.badge{
  display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;
  border-radius:var(--r-full);font-size:11px;font-weight:700;letter-spacing:.01em;
  border:1px solid transparent;white-space:nowrap;
}
.badge svg{width:11px;height:11px;stroke-width:2.6}
.b-ok{background:var(--ok-soft);color:var(--ok);border-color:rgba(16,185,129,.28)}
.b-warn{background:var(--warn-soft);color:var(--warn);border-color:rgba(245,158,11,.3)}
.b-crit{background:var(--crit-soft);color:var(--crit);border-color:rgba(244,63,94,.3)}
.b-info{background:var(--info-soft);color:var(--info);border-color:rgba(56,189,248,.3)}
.b-brand{background:rgba(99,102,241,.16);color:var(--brand-300);border-color:rgba(99,102,241,.32)}
[data-theme="light"] .b-brand{color:var(--brand-700)}
.b-neutral{background:var(--panel-2);color:var(--txt-2);border-color:var(--stroke)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot-ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.dot-warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.dot-crit{background:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}
.dot-live{position:relative}
.dot-live::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:1px solid currentColor;animation:ping 1.9s var(--ease-in-out) infinite}

/* Cards */
.card{
  position:relative;background:var(--panel);border:1px solid var(--stroke);
  border-radius:var(--r-lg);backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  box-shadow:var(--shadow);transition:transform var(--t) var(--ease),border-color var(--t) var(--ease),box-shadow var(--t) var(--ease);
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);opacity:.5;
}
[data-theme="light"] .card::before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent)}
.card-hover:hover{transform:translateY(-3px);border-color:var(--stroke-2);box-shadow:var(--shadow-lg)}
.card-pad{padding:20px 22px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 22px;border-bottom:1px solid var(--stroke)}
.card-h h3{font-size:14.5px;font-weight:600}
.card-h .sub{font-size:11.5px;color:var(--txt-dim);margin-top:2px}
.card-b{padding:20px 22px}
.card-f{padding:13px 22px;border-top:1px solid var(--stroke);background:rgba(0,0,0,.08)}
[data-theme="light"] .card-f{background:rgba(16,24,56,.02)}

/* Grid utilitário */
.grid{display:grid;gap:18px}
.grid > *{min-width:0}   /* impede que conteúdo longo estique a coluna */
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
.span2{grid-column:span 2}
.span3{grid-column:span 3}
.span4{grid-column:span 4}

/* ─────────── 4. SHELL ─────────── */
.app{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{
  width:var(--sb-w);flex:none;position:sticky;top:0;height:100vh;z-index:60;
  display:flex;flex-direction:column;
  background:var(--glass);backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border-right:1px solid var(--stroke);
  transition:width var(--t) var(--ease),transform var(--t) var(--ease);
}
.app.collapsed .sidebar{width:var(--sb-w-collapsed)}
.app.collapsed .sb-label,.app.collapsed .sb-sec-title,.app.collapsed .sb-badge,
.app.collapsed .sb-foot-txt,.app.collapsed .brand-txt{opacity:0;pointer-events:none;width:0}
.app.collapsed .sb-item{justify-content:center;padding:0 0}
.app.collapsed .sb-foot-card{padding:12px 10px;justify-content:center}

.sb-brand{display:flex;align-items:center;gap:12px;height:var(--topbar-h);padding:0 18px;flex:none;border-bottom:1px solid var(--stroke)}
.logo-mark{
  width:36px;height:36px;flex:none;border-radius:11px;position:relative;
  background:linear-gradient(135deg,#4F46E5,#8B5CF6 50%,#22D3EE);
  display:grid;place-items:center;
  box-shadow:0 8px 22px -8px rgba(99,102,241,.9), inset 0 1px 0 rgba(255,255,255,.4);
}
.logo-mark svg{width:19px;height:19px;color:#fff;stroke-width:2.4}
.logo-mark::after{content:'';position:absolute;inset:-4px;border-radius:15px;background:inherit;filter:blur(13px);opacity:.5;z-index:-1}
.brand-txt{overflow:hidden;transition:opacity var(--t) var(--ease)}
.brand-txt strong{display:block;font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:-.028em;white-space:nowrap}
.brand-txt span{display:block;font-size:9.5px;font-weight:600;letter-spacing:.13em;color:var(--txt-dim);text-transform:uppercase;white-space:nowrap;margin-top:-1px}

.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 12px 8px}
.sb-sec-title{padding:14px 12px 7px;transition:opacity var(--t) var(--ease);white-space:nowrap;overflow:hidden}
.sb-item{
  display:flex;align-items:center;gap:12px;height:41px;padding:0 12px;margin-bottom:3px;
  border-radius:11px;color:var(--txt-2);font-size:13.2px;font-weight:500;
  position:relative;transition:all var(--t-fast) var(--ease);cursor:pointer;
}
.sb-item svg{width:17.5px;height:17.5px;flex:none;stroke-width:1.9;transition:transform var(--t) var(--ease)}
.sb-label{white-space:nowrap;overflow:hidden;transition:opacity var(--t) var(--ease)}
.sb-item:hover{background:var(--panel-2);color:var(--txt)}
.sb-item:hover svg{transform:scale(1.08)}
.sb-item.active{
  color:var(--txt);font-weight:600;
  background:linear-gradient(100deg,rgba(99,102,241,.24),rgba(139,92,246,.1) 60%,transparent);
  box-shadow:inset 0 0 0 1px rgba(99,102,241,.3);
}
.sb-item.active svg{color:var(--brand-300)}
[data-theme="light"] .sb-item.active svg{color:var(--brand-600)}
.sb-item.active::before{
  content:'';position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 4px 4px 0;
  background:linear-gradient(180deg,var(--cyan),var(--brand),var(--violet));box-shadow:0 0 12px rgba(99,102,241,.9);
}
.sb-badge{
  margin-left:auto;height:19px;min-width:19px;padding:0 6px;border-radius:var(--r-full);
  font-size:10.5px;font-weight:800;display:grid;place-items:center;
  background:var(--crit);color:#fff;transition:opacity var(--t) var(--ease);
  box-shadow:0 0 0 3px var(--crit-soft);
}
.sb-badge.soft{background:var(--panel-2);color:var(--txt-dim);box-shadow:none;border:1px solid var(--stroke)}

.sb-foot{padding:12px;flex:none;border-top:1px solid var(--stroke)}
.sb-foot-card{
  display:flex;align-items:center;gap:11px;padding:12px;border-radius:14px;
  background:linear-gradient(135deg,rgba(99,102,241,.16),rgba(34,211,238,.07));
  border:1px solid rgba(99,102,241,.22);cursor:pointer;transition:all var(--t) var(--ease);
}
.sb-foot-card:hover{border-color:rgba(99,102,241,.45);transform:translateY(-2px)}
.sb-foot-txt{overflow:hidden;transition:opacity var(--t) var(--ease)}
.sb-foot-txt strong{display:block;font-size:12.2px;white-space:nowrap;font-weight:650}
.sb-foot-txt span{display:block;font-size:10.5px;color:var(--txt-dim);white-space:nowrap}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* Topbar */
.topbar{
  height:var(--topbar-h);flex:none;position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:14px;padding:0 26px;
  background:var(--glass);backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border-bottom:1px solid var(--stroke);
}
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt-dim);min-width:0}
.crumb b{color:var(--txt);font-weight:600}
.crumb svg{width:13px;height:13px;opacity:.5}

.search{
  position:relative;width:min(360px,32vw);
}
.search input{
  width:100%;height:38px;padding:0 40px 0 38px;border-radius:var(--r-full);
  background:var(--panel);border:1px solid var(--stroke);font-size:13px;
  transition:all var(--t) var(--ease);
}
.search input::placeholder{color:var(--txt-3)}
.search input:focus{outline:none;border-color:rgba(99,102,241,.5);background:var(--panel-2);box-shadow:0 0 0 4px rgba(99,102,241,.1)}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--txt-3);pointer-events:none}
.search kbd{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  font-family:var(--f-mono);font-size:10px;padding:2px 6px;border-radius:6px;
  background:var(--panel-2);border:1px solid var(--stroke);color:var(--txt-3);pointer-events:none;
}

.env-pill{
  display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:var(--r-full);
  background:var(--ok-soft);border:1px solid rgba(16,185,129,.25);color:var(--ok);
  font-size:11px;font-weight:700;letter-spacing:.02em;
}
.avatar{
  width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--violet),var(--brand));color:#fff;
  font-size:12px;font-weight:700;font-family:var(--f-display);
  box-shadow:0 4px 14px -4px rgba(139,92,246,.8);cursor:pointer;
}
.user-chip{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border-radius:var(--r-full);border:1px solid var(--stroke);background:var(--panel);transition:all var(--t-fast) var(--ease)}
.user-chip:hover{background:var(--panel-2);border-color:var(--stroke-2)}
.user-chip .nm{font-size:12.4px;font-weight:600;line-height:1.15;white-space:nowrap}
.user-chip .rl{font-size:10.5px;color:var(--txt-dim);white-space:nowrap}

/* Área de conteúdo */
.content{padding:26px;flex:1;max-width:1720px;width:100%;margin:0 auto}
.view{display:none}
.view.active{display:block;animation:viewIn .5s var(--ease) both}

/* Cabeçalho de página */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.page-h h1{font-size:27px;font-weight:700;letter-spacing:-.032em;display:flex;align-items:center;gap:12px}
.page-h p{color:var(--txt-2);font-size:13.4px;margin-top:5px;max-width:70ch}
.page-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}


/* ─────────── 5. COMPONENTES ─────────── */

/* KPI Card */
.kpi{position:relative;padding:19px 20px 17px;border-radius:var(--r-lg);overflow:hidden;
  background:var(--panel);border:1px solid var(--stroke);backdrop-filter:blur(20px);
  box-shadow:var(--shadow);transition:all var(--t) var(--ease);cursor:default}
.kpi:hover{transform:translateY(-4px);border-color:var(--stroke-2);box-shadow:var(--shadow-lg)}
.kpi::after{
  content:'';position:absolute;right:-40px;top:-60px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,var(--kpi-glow,rgba(99,102,241,.28)),transparent 68%);
  opacity:.85;transition:transform var(--t-slow) var(--ease);pointer-events:none;
}
.kpi:hover::after{transform:scale(1.25)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;position:relative}
.kpi-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:var(--kpi-bg,rgba(99,102,241,.15));border:1px solid var(--kpi-bd,rgba(99,102,241,.28))}
.kpi-ico svg{width:16.5px;height:16.5px;color:var(--kpi-c,var(--brand-300));stroke-width:2.1}
.kpi-lbl{font-size:11.5px;font-weight:600;color:var(--txt-dim);letter-spacing:.01em}
.kpi-val{font-family:var(--f-display);font-size:29px;font-weight:700;letter-spacing:-.038em;line-height:1.05;font-variant-numeric:tabular-nums;position:relative}
.kpi-val small{font-size:15px;font-weight:600;color:var(--txt-2);margin-left:3px;letter-spacing:-.02em}
.kpi-sub{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:11.5px;color:var(--txt-dim);position:relative}
.trend{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:11.5px}
.trend svg{width:12px;height:12px;stroke-width:2.8}
.t-up{color:var(--ok)} .t-down{color:var(--crit)} .t-flat{color:var(--txt-dim)}
.spark{height:34px;margin-top:11px;position:relative}

/* Barra de progresso */
.bar{height:6px;border-radius:99px;background:var(--panel-2);overflow:hidden;position:relative;border:1px solid var(--stroke)}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--violet));
  width:0;transition:width 1.2s var(--ease);position:relative}
.bar > i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shimmer 2.4s infinite}
.bar.ok > i{background:linear-gradient(90deg,var(--ok),var(--teal))}
.bar.warn > i{background:linear-gradient(90deg,var(--warn),#FBBF24)}
.bar.crit > i{background:linear-gradient(90deg,var(--crit),#FB7185)}
.bar.lg{height:9px}

/* Faixa / Card de IA */
.ai-strip{
  position:relative;border-radius:var(--r-lg);padding:1px;overflow:hidden;
  background:linear-gradient(120deg,rgba(99,102,241,.55),rgba(34,211,238,.42) 40%,rgba(139,92,246,.55));
  background-size:220% 220%;animation:gradShift 9s var(--ease-in-out) infinite;
  box-shadow:0 20px 50px -26px rgba(99,102,241,.8);
}
.ai-strip-in{
  border-radius:calc(var(--r-lg) - 1px);padding:19px 22px;
  background:linear-gradient(120deg,rgba(12,16,29,.94),rgba(14,18,34,.9));
  display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;
}
[data-theme="light"] .ai-strip-in{background:linear-gradient(120deg,rgba(255,255,255,.96),rgba(248,250,255,.94))}
.ai-orb{
  width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;position:relative;
  background:linear-gradient(135deg,#4F46E5,#8B5CF6 48%,#22D3EE);
  box-shadow:0 8px 24px -6px rgba(99,102,241,.9), inset 0 1px 0 rgba(255,255,255,.35);
}
.ai-orb svg{width:19px;height:19px;color:#fff;stroke-width:2.2}
.ai-orb::before{content:'';position:absolute;inset:-5px;border-radius:18px;border:1px solid rgba(99,102,241,.5);animation:ping 2.6s var(--ease-in-out) infinite}
.ai-orb.lg{width:48px;height:48px;border-radius:15px}
.ai-orb.lg svg{width:23px;height:23px}

.ai-title{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-family:var(--f-display);font-size:14px;font-weight:650;margin-bottom:5px}
.ai-body{font-size:13.3px;color:var(--txt-2);line-height:1.62;max-width:96ch}
.ai-body b{color:var(--txt);font-weight:650}
.ai-body .hi{color:var(--cyan);font-weight:700}
[data-theme="light"] .ai-body .hi{color:#0E7490}
.ai-body .money{color:var(--ok);font-weight:700;font-family:var(--f-mono);font-size:13px}
.ai-metrics{display:flex;gap:26px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--stroke)}
.ai-metric .k{font-size:10.5px;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.ai-metric .v{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:-.03em;margin-top:2px}

/* Card de insight compacto */
.insight{
  display:flex;gap:13px;padding:15px 16px;border-radius:var(--r-md);
  background:var(--panel);border:1px solid var(--stroke);
  transition:all var(--t) var(--ease);cursor:pointer;position:relative;overflow:hidden;
}
.insight:hover{border-color:var(--stroke-2);transform:translateX(3px);background:var(--panel-2)}
.insight::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ic,var(--brand))}
.insight-ico{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:var(--ic-bg,rgba(99,102,241,.14));border:1px solid var(--ic-bd,rgba(99,102,241,.25))}
.insight-ico svg{width:15px;height:15px;color:var(--ic,var(--brand-300));stroke-width:2.2}
/* impede que o texto estoure o card em telas estreitas */
.insight > div:not(.insight-ico),.evt > div:not(.evt-ico),.queue-item > div:not(.q-pos){min-width:0}
.insight h4{font-size:13px;font-weight:650;margin-bottom:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.insight p{font-size:12.2px;color:var(--txt-2);line-height:1.55}
.insight .impact{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Tabelas */
.tbl-wrap{overflow-x:auto}
.tbl{font-size:12.8px;min-width:640px}
.tbl thead th{
  text-align:left;padding:10px 14px;font-size:10.5px;font-weight:750;color:var(--txt-dim);
  text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;
  border-bottom:1px solid var(--stroke);position:sticky;top:0;background:var(--panel-solid);z-index:2;
}
.tbl tbody td{padding:12px 14px;border-bottom:1px solid var(--stroke);vertical-align:middle}
.tbl tbody tr{transition:background var(--t-fast) var(--ease);cursor:pointer}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl .c{text-align:center}
.cell-main{font-weight:600;color:var(--txt)}
.cell-sub{font-size:11px;color:var(--txt-dim);margin-top:1px}

/* Filtros / Segmented */
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--panel);border:1px solid var(--stroke);gap:2px}
.seg button{padding:0 13px;height:29px;border-radius:8px;font-size:12px;font-weight:600;color:var(--txt-dim);transition:all var(--t-fast) var(--ease);white-space:nowrap}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--panel-2);color:var(--txt);box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--stroke)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r-full);
  background:var(--panel);border:1px solid var(--stroke);font-size:12px;font-weight:550;color:var(--txt-2);
  transition:all var(--t-fast) var(--ease);cursor:pointer}
.chip:hover{border-color:var(--stroke-2);color:var(--txt)}
.chip.on{background:rgba(99,102,241,.16);border-color:rgba(99,102,241,.4);color:var(--brand-300)}
[data-theme="light"] .chip.on{color:var(--brand-700)}
.chip svg{width:13px;height:13px}

/* Select & Input */
.sel,.inp{height:34px;padding:0 12px;border-radius:10px;background:var(--panel);border:1px solid var(--stroke);
  font-size:12.5px;color:var(--txt);transition:all var(--t-fast) var(--ease);min-width:0}
.sel:focus,.inp:focus{outline:none;border-color:rgba(99,102,241,.5);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.sel option{background:var(--panel-solid);color:var(--txt)}

/* Tooltip */
[data-tip]{position:relative}
[data-tip]::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%) translateY(4px);
  padding:7px 11px;border-radius:9px;background:var(--panel-solid);border:1px solid var(--stroke-2);
  color:var(--txt);font-size:11.5px;font-weight:500;white-space:nowrap;letter-spacing:0;text-transform:none;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all var(--t) var(--ease);z-index:200;
}
[data-tip]:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}

/* Toast */
.toasts{position:fixed;right:22px;bottom:22px;z-index:400;display:flex;flex-direction:column;gap:11px;max-width:400px}
.toast{
  display:flex;gap:12px;padding:14px 16px;border-radius:15px;
  background:var(--glass);backdrop-filter:blur(26px) saturate(170%);
  -webkit-backdrop-filter:blur(26px) saturate(170%);
  border:1px solid var(--stroke-2);box-shadow:var(--shadow-lg);
  animation:toastIn .5s var(--ease) both;position:relative;overflow:hidden;
}
.toast.out{animation:toastOut .35s var(--ease) forwards}
.toast::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc,var(--brand))}
.toast-ico{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--tbg,rgba(99,102,241,.16))}
.toast-ico svg{width:15px;height:15px;color:var(--tc,var(--brand-300));stroke-width:2.3}
.toast h5{font-size:12.8px;font-weight:650;margin-bottom:2px}
.toast p{font-size:11.8px;color:var(--txt-2);line-height:1.5}
.toast .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--tc,var(--brand));animation:toastBar 5.4s linear forwards}

/* Skeleton */
.sk{border-radius:9px;background:linear-gradient(90deg,var(--panel) 25%,var(--panel-2) 37%,var(--panel) 63%);
  background-size:400% 100%;animation:skel 1.5s ease-in-out infinite}
.sk-line{height:11px;margin-bottom:9px}
.sk-box{height:100%;width:100%;min-height:80px;border-radius:var(--r-md)}

/* Overlay de processamento IA */
.ai-overlay{
  position:absolute;inset:0;z-index:30;display:none;place-items:center;
  background:rgba(5,7,15,.72);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  border-radius:inherit;
}
[data-theme="light"] .ai-overlay{background:rgba(244,246,252,.8)}
.ai-overlay.on{display:grid;animation:fadeIn .3s var(--ease)}
.ai-load{text-align:center;max-width:400px;padding:22px}
.ai-load .ring{width:70px;height:70px;margin:0 auto 18px;position:relative}
.ai-load .ring::before,.ai-load .ring::after{
  content:'';position:absolute;inset:0;border-radius:50%;border:2.5px solid transparent}
.ai-load .ring::before{border-top-color:var(--brand);border-right-color:var(--violet);animation:spin 1.05s linear infinite}
.ai-load .ring::after{inset:11px;border-bottom-color:var(--cyan);border-left-color:var(--brand-300);animation:spin 1.5s linear reverse infinite}
.ai-load .ring i{position:absolute;inset:0;display:grid;place-items:center}
.ai-load .ring svg{width:22px;height:22px;color:var(--brand-300)}
.ai-load h4{font-size:15px;font-weight:650;margin-bottom:7px}
.ai-load p{font-size:12.5px;color:var(--txt-2);min-height:38px}
.ai-steps{margin-top:16px;text-align:left;display:flex;flex-direction:column;gap:7px}
.ai-step{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--txt-dim);opacity:.4;transition:all var(--t) var(--ease)}
.ai-step.on{opacity:1;color:var(--txt-2)}
.ai-step.done{opacity:1;color:var(--ok)}
.ai-step svg{width:14px;height:14px;flex:none}

/* Modal / Drawer */
.scrim{position:fixed;inset:0;z-index:300;background:rgba(4,6,14,.66);backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);display:none;animation:fadeIn .3s var(--ease)}
.scrim.on{display:block}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);z-index:310;
  background:var(--panel-solid);border-left:1px solid var(--stroke-2);
  box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform var(--t-slow) var(--ease);
  display:flex;flex-direction:column;
}
.drawer.on{transform:translateX(0)}
.drawer-h{padding:20px 24px;border-bottom:1px solid var(--stroke);display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.drawer-b{flex:1;overflow-y:auto;padding:22px 24px}
.drawer-f{padding:16px 24px;border-top:1px solid var(--stroke);display:flex;gap:10px;justify-content:flex-end}

/* Painel de notificações */
.notif-panel{
  position:absolute;top:calc(100% + 10px);right:0;width:min(400px,92vw);z-index:120;
  background:var(--glass);backdrop-filter:blur(28px) saturate(170%);
  -webkit-backdrop-filter:blur(28px) saturate(170%);
  border:1px solid var(--stroke-2);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:all var(--t) var(--ease);
  overflow:hidden;
}
.notif-panel.on{opacity:1;transform:none;pointer-events:auto}
.notif-item{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid var(--stroke);transition:background var(--t-fast);cursor:pointer}
.notif-item:hover{background:var(--panel-2)}
.notif-item:last-child{border-bottom:0}
.notif-item h6{font-size:12.4px;font-weight:650;margin-bottom:2px}
.notif-item p{font-size:11.5px;color:var(--txt-2);line-height:1.5}
.notif-item .tm{font-size:10.5px;color:var(--txt-3);margin-top:4px;font-family:var(--f-mono)}
.bell{position:relative}
.bell .cnt{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;
  background:var(--crit);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;
  border:2px solid var(--bg);box-shadow:0 0 10px rgba(244,63,94,.8)}

/* Mapa */
.map-wrap{position:relative;width:100%;border-radius:var(--r-md);overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,rgba(99,102,241,.09),transparent 65%)}
.br-map{width:100%;height:auto;display:block}
.br-land{fill:var(--map-land);stroke:var(--map-stroke);stroke-width:1.6;stroke-linejoin:round;
  filter:drop-shadow(0 8px 24px rgba(99,102,241,.28))}
.node{cursor:pointer;transition:all var(--t) var(--ease)}
.node circle.core{transition:all var(--t) var(--ease)}
.node:hover circle.core{r:11}
.node text{font-family:var(--f-body);font-size:13px;font-weight:600;fill:var(--txt-2);pointer-events:none}
.pulse-ring{transform-box:fill-box;transform-origin:center;animation:pulseRing 2.8s var(--ease-in-out) infinite}
.route-line{fill:none;stroke-linecap:round;stroke-dasharray:6 9;animation:dash 2.2s linear infinite}
.flow-line{fill:none;stroke-linecap:round;opacity:.55}

/* Timeline de docas (Gantt) */
.gantt{position:relative;overflow-x:auto;padding-bottom:6px}
.gantt-inner{min-width:1080px}
.gantt-head{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--stroke);position:sticky;top:0;background:var(--panel-solid);z-index:3}
.gantt-hours{display:grid;grid-template-columns:repeat(14,1fr)}
.gantt-hours span{font-size:10.5px;color:var(--txt-dim);font-family:var(--f-mono);padding:9px 0 8px 6px;border-left:1px solid var(--stroke)}
.gantt-row{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--stroke);min-height:56px}
.gantt-row:last-child{border-bottom:0}
.gantt-lbl{padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:3px;border-right:1px solid var(--stroke);background:var(--panel)}
.gantt-lbl strong{font-size:12.5px;font-weight:650}
.gantt-track{position:relative;background-image:repeating-linear-gradient(90deg,var(--grid-line) 0 1px,transparent 1px calc(100%/14))}
.slot{
  position:absolute;top:8px;bottom:8px;border-radius:9px;padding:6px 9px;cursor:grab;
  display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  border:1px solid var(--sl-bd,rgba(99,102,241,.4));background:var(--sl-bg,rgba(99,102,241,.2));
  transition:left .95s var(--ease),width .95s var(--ease),background var(--t) var(--ease),transform var(--t-fast) var(--ease),box-shadow var(--t) var(--ease);
  backdrop-filter:blur(6px);
}
.slot:hover{transform:translateY(-2px) scale(1.012);box-shadow:var(--shadow);z-index:5;border-color:var(--stroke-2)}
.slot:active{cursor:grabbing}
.slot b{font-size:11.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.slot span{font-size:10px;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-mono)}
.slot.moved{animation:slotGlow 1.6s var(--ease)}
.now-line{position:absolute;top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,var(--crit),transparent);z-index:4;pointer-events:none}
.now-line::before{content:'AGORA';position:absolute;top:-1px;left:50%;transform:translateX(-50%);
  font-size:8.5px;font-weight:800;letter-spacing:.1em;color:#fff;background:var(--crit);padding:2px 5px;border-radius:0 0 5px 5px}

/* Fila de caminhões */
.queue-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:13px;
  background:var(--panel);border:1px solid var(--stroke);transition:all var(--t) var(--ease);cursor:pointer}
.queue-item:hover{border-color:var(--stroke-2);transform:translateX(3px)}
.q-pos{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:11.5px;font-weight:700;background:var(--panel-2);border:1px solid var(--stroke)}
.q-pos.p1{background:linear-gradient(135deg,var(--brand),var(--violet));color:#fff;border-color:transparent}
.plate{font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.04em;
  padding:2px 7px;border-radius:6px;background:var(--panel-2);border:1px solid var(--stroke);white-space:nowrap}

/* Chat / Agente */
.chat-shell{display:grid;grid-template-columns:270px 1fr;gap:18px;height:calc(100vh - var(--topbar-h) - 130px);min-height:560px}
.chat-main{display:flex;flex-direction:column;overflow:hidden}
.chat-log{flex:1;overflow-y:auto;padding:24px 26px;display:flex;flex-direction:column;gap:20px;scroll-behavior:smooth}
.msg{display:flex;gap:13px;max-width:88%;animation:msgIn .45s var(--ease) both}
.msg.me{margin-left:auto;flex-direction:row-reverse}
.msg-av{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center}
.msg-av.ai{background:linear-gradient(135deg,#4F46E5,#8B5CF6 50%,#22D3EE);box-shadow:0 6px 18px -6px rgba(99,102,241,.8)}
.msg-av.ai svg{width:16px;height:16px;color:#fff;stroke-width:2.3}
.msg-av.me{background:var(--panel-2);border:1px solid var(--stroke);font-size:11px;font-weight:700;color:var(--txt-2)}
.bubble{padding:14px 17px;border-radius:16px;font-size:13.2px;line-height:1.65;
  background:var(--panel);border:1px solid var(--stroke)}
.msg.me .bubble{background:linear-gradient(135deg,rgba(99,102,241,.22),rgba(139,92,246,.14));border-color:rgba(99,102,241,.3)}
.bubble b{font-weight:650;color:var(--txt)}
.bubble .money{color:var(--ok);font-family:var(--f-mono);font-weight:700}
.bubble ul{margin:9px 0 2px;display:flex;flex-direction:column;gap:7px}
.bubble li{display:flex;gap:9px;font-size:12.6px;color:var(--txt-2);line-height:1.55}
.bubble li::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--brand);margin-top:8px;flex:none}
.src-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px solid var(--stroke)}
.src{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:7px;
  background:var(--panel-2);border:1px solid var(--stroke);font-size:10.5px;font-weight:600;color:var(--txt-dim)}
.src svg{width:11px;height:11px}
.typing{display:flex;gap:4px;padding:15px 18px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--brand-300);animation:bounce 1.3s var(--ease-in-out) infinite}
.typing i:nth-child(2){animation-delay:.16s} .typing i:nth-child(3){animation-delay:.32s}
.chat-input{padding:16px 20px;border-top:1px solid var(--stroke);background:var(--panel)}
.chat-box{display:flex;align-items:flex-end;gap:10px;padding:9px 9px 9px 16px;border-radius:16px;
  background:var(--panel-2);border:1px solid var(--stroke);transition:all var(--t) var(--ease)}
.chat-box:focus-within{border-color:rgba(99,102,241,.5);box-shadow:0 0 0 4px rgba(99,102,241,.1)}
.chat-box textarea{flex:1;background:none;border:0;resize:none;font-size:13.3px;max-height:120px;line-height:1.55;padding:8px 0}
.chat-box textarea:focus{outline:none}
.suggest{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.suggest button{padding:8px 13px;border-radius:11px;background:var(--panel-2);border:1px solid var(--stroke);
  font-size:12px;color:var(--txt-2);transition:all var(--t-fast) var(--ease);text-align:left}
.suggest button:hover{border-color:rgba(99,102,241,.45);color:var(--txt);transform:translateY(-2px)}

/* Copilot flutuante */
.copilot-fab{
  position:fixed;right:24px;bottom:24px;z-index:250;width:56px;height:56px;border-radius:19px;
  background:linear-gradient(135deg,#4F46E5,#8B5CF6 48%,#22D3EE);background-size:200% 200%;
  display:grid;place-items:center;cursor:pointer;animation:gradShift 8s var(--ease-in-out) infinite;
  box-shadow:0 16px 40px -12px rgba(99,102,241,.95), inset 0 1px 0 rgba(255,255,255,.32);
  transition:transform var(--t) var(--ease);
}
.copilot-fab:hover{transform:scale(1.08) rotate(-4deg)}
.copilot-fab svg{width:24px;height:24px;color:#fff;stroke-width:2.1}
.copilot-fab::after{content:'';position:absolute;inset:-6px;border-radius:25px;border:1px solid rgba(99,102,241,.5);animation:ping 2.8s var(--ease-in-out) infinite}

/* Torre de controle - feed de eventos */
.evt{display:flex;gap:12px;padding:13px 15px;border-radius:13px;background:var(--panel);
  border:1px solid var(--stroke);transition:all var(--t) var(--ease);animation:evtIn .5s var(--ease) both}
.evt:hover{border-color:var(--stroke-2);background:var(--panel-2)}
.evt-time{font-family:var(--f-mono);font-size:10.5px;color:var(--txt-3);white-space:nowrap;padding-top:2px}
.evt-ico{width:28px;height:28px;flex:none;border-radius:9px;display:grid;place-items:center;
  background:var(--ec-bg,rgba(99,102,241,.14));border:1px solid var(--ec-bd,rgba(99,102,241,.24))}
.evt-ico svg{width:14px;height:14px;color:var(--ec,var(--brand-300));stroke-width:2.3}
.evt h5{font-size:12.5px;font-weight:650;margin-bottom:2px}
.evt p{font-size:11.8px;color:var(--txt-2);line-height:1.5}

/* Slider do simulador */
.slider-row{margin-bottom:19px}
.slider-row .lbl{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.slider-row .lbl span{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.slider-row .lbl b{font-family:var(--f-mono);font-size:14px;font-weight:700;color:var(--brand-300);
  padding:3px 9px;border-radius:8px;background:rgba(99,102,241,.14);border:1px solid rgba(99,102,241,.26)}
[data-theme="light"] .slider-row .lbl b{color:var(--brand-700)}
input[type=range]{width:100%;height:5px;-webkit-appearance:none;appearance:none;border-radius:99px;
  background:linear-gradient(90deg,var(--brand) var(--pct,50%),var(--panel-2) var(--pct,50%));cursor:pointer;border:1px solid var(--stroke)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
  background:#fff;border:3px solid var(--brand);cursor:grab;box-shadow:0 3px 12px rgba(99,102,241,.7);transition:transform var(--t-fast)}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18)}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:#fff;border:3px solid var(--brand);cursor:grab}

/* Switch */
.switch{width:40px;height:23px;border-radius:99px;background:var(--panel-2);border:1px solid var(--stroke);
  position:relative;cursor:pointer;transition:all var(--t) var(--ease);flex:none}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
  background:var(--txt-dim);transition:all var(--t) var(--ease)}
.switch.on{background:linear-gradient(135deg,var(--brand-600),var(--violet));border-color:transparent}
.switch.on::after{left:19px;background:#fff}

/* Integrações */
.integ{display:flex;align-items:center;gap:14px;padding:16px 17px;border-radius:var(--r-md);
  background:var(--panel);border:1px solid var(--stroke);transition:all var(--t) var(--ease)}
.integ:hover{border-color:var(--stroke-2);transform:translateY(-3px);box-shadow:var(--shadow)}
.integ-logo{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;
  font-family:var(--f-display);font-size:13px;font-weight:800;letter-spacing:-.04em;color:#fff}

/* Heatmap */
.heat{display:grid;grid-template-columns:46px repeat(12,1fr);gap:4px;align-items:center}
.heat-cell{aspect-ratio:1.5;border-radius:6px;transition:all var(--t-fast) var(--ease);cursor:pointer;position:relative}
.heat-cell:hover{transform:scale(1.22);z-index:5;box-shadow:0 0 0 2px var(--txt-2)}
.heat-lbl{font-size:10px;color:var(--txt-dim);font-family:var(--f-mono);text-align:right;padding-right:5px}

/* Ranking */
.rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--stroke)}
.rank:last-child{border-bottom:0}
.rank-n{width:23px;height:23px;flex:none;border-radius:7px;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:11px;font-weight:700;background:var(--panel-2);border:1px solid var(--stroke);color:var(--txt-dim)}
.rank-n.top{background:linear-gradient(135deg,#F59E0B,#FBBF24);color:#3B2600;border-color:transparent}

/* Comparativo antes/depois */
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}
.ba-box{padding:20px;border-radius:var(--r-md);border:1px solid var(--stroke);background:var(--panel);text-align:center}
.ba-box.after{border-color:rgba(16,185,129,.35);background:linear-gradient(160deg,rgba(16,185,129,.11),transparent)}
.ba-box .v{font-family:var(--f-display);font-size:32px;font-weight:750;letter-spacing:-.04em;line-height:1}
.ba-arrow{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),var(--violet));color:#fff;box-shadow:0 8px 22px -8px rgba(99,102,241,.9)}
.ba-arrow svg{width:18px;height:18px}

/* Truck viz */
.truck-viz{display:flex;gap:5px;flex-wrap:wrap}
.truck-i{width:26px;height:20px;border-radius:5px;display:grid;place-items:center;
  background:var(--panel-2);border:1px solid var(--stroke);transition:all var(--t) var(--ease)}
.truck-i svg{width:13px;height:13px;color:var(--txt-dim)}
.truck-i.used{background:rgba(99,102,241,.2);border-color:rgba(99,102,241,.4)}
.truck-i.used svg{color:var(--brand-300)}
.truck-i.saved{background:rgba(16,185,129,.16);border-color:rgba(16,185,129,.35)}
.truck-i.saved svg{color:var(--ok)}
.truck-i.removed{opacity:.25;filter:grayscale(1)}

/* Gauge/anel */
.ring-kpi{position:relative;width:118px;height:118px;margin:0 auto}
.ring-kpi svg{transform:rotate(-90deg)}
.ring-kpi .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-kpi .val b{font-family:var(--f-display);font-size:23px;font-weight:750;letter-spacing:-.04em;display:block}
.ring-kpi .val span{font-size:10px;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.08em;font-weight:700}

/* ─────────── 7. ANIMAÇÕES ─────────── */
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(1);opacity:.75}70%,100%{transform:scale(1.5);opacity:0}}
@keyframes pulseRing{0%{transform:scale(.55);opacity:.85}75%,100%{transform:scale(2.1);opacity:0}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes dash{to{stroke-dashoffset:-30}}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-6px);opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateX(70px) scale(.95)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(70px) scale(.95)}}
@keyframes toastBar{from{width:100%}to{width:0}}
@keyframes msgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes evtIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes slotGlow{0%{box-shadow:0 0 0 0 rgba(34,211,238,.75)}100%{box-shadow:0 0 0 16px rgba(34,211,238,0)}}
@keyframes countUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.stagger > *{animation:viewIn .55s var(--ease) both}
.stagger > *:nth-child(1){animation-delay:.02s} .stagger > *:nth-child(2){animation-delay:.06s}
.stagger > *:nth-child(3){animation-delay:.1s}  .stagger > *:nth-child(4){animation-delay:.14s}
.stagger > *:nth-child(5){animation-delay:.18s} .stagger > *:nth-child(6){animation-delay:.22s}
.stagger > *:nth-child(7){animation-delay:.26s} .stagger > *:nth-child(8){animation-delay:.3s}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ─────────── 8. RESPONSIVO ─────────── */
.sb-toggle-mobile{display:none}
@media(max-width:1400px){
  .g6{grid-template-columns:repeat(3,1fr)}
  .g5{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:1180px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(2,1fr)}
  .span3,.span4{grid-column:span 2}
  .chat-shell{grid-template-columns:1fr}
  .chat-side{display:none}
}
@media(max-width:900px){
  :root{--topbar-h:62px}
  .sidebar{position:fixed;transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  .app.mobile-open .sidebar{transform:translateX(0)}
  .app.collapsed .sidebar{width:var(--sb-w)}
  .app.collapsed .sb-label,.app.collapsed .sb-sec-title,.app.collapsed .sb-badge,
  .app.collapsed .sb-foot-txt,.app.collapsed .brand-txt{opacity:1;width:auto}
  .sb-toggle-mobile{display:inline-flex}
  .sb-toggle-desk{display:none}
  .content{padding:18px 15px}
  .search{width:auto;flex:1}
  .search kbd{display:none}
  .hide-sm{display:none!important}
  .page-h h1{font-size:22px}
  .kpi-val{font-size:25px}
}
@media(max-width:900px){
  /* grids com colunas definidas inline também colapsam em telas estreitas */
  .grid[style*="grid-template-columns"]{grid-template-columns:1fr!important}
}
@media(max-width:680px){
  .grid{grid-template-columns:1fr!important}
  .g2,.g3,.g4,.g5,.g6{grid-template-columns:1fr}
  .span2,.span3,.span4{grid-column:span 1}
  .ba{grid-template-columns:1fr}
  .ba-arrow{transform:rotate(90deg);margin:0 auto}
  .toasts{left:14px;right:14px;max-width:none}
}
</style>

<script>
/* ══════════════════════════════════════════════
   CAMADA 2 · UI — Helpers, componentes e gráficos
   ══════════════════════════════════════════════ */
const UI = {

  /* ---- Utilidades ---- */
  el: (sel, root=document) => root.querySelector(sel),
  els: (sel, root=document) => [...root.querySelectorAll(sel)],
  icons(){ if (window.lucide) lucide.createIcons(); },

  css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); },
  isDark(){ return document.documentElement.dataset.theme === 'dark'; },

  brl(n, dec=0){
    return 'R$ ' + n.toLocaleString('pt-BR',{minimumFractionDigits:dec, maximumFractionDigits:dec});
  },
  nb(n, dec=0){ return n.toLocaleString('pt-BR',{minimumFractionDigits:dec, maximumFractionDigits:dec}); },

  sevColor(s){
    return { crit:'var(--crit)', warn:'var(--warn)', ok:'var(--ok)', info:'var(--info)' }[s] || 'var(--brand)';
  },
  sevSoft(s){
    return { crit:'var(--crit-soft)', warn:'var(--warn-soft)', ok:'var(--ok-soft)', info:'var(--info-soft)' }[s] || 'rgba(99,102,241,.14)';
  },
  sevBadge(s){ return { crit:'b-crit', warn:'b-warn', ok:'b-ok', info:'b-info' }[s] || 'b-brand'; },

  /* ---- Toasts ---- */
  toast(title, msg, sev='info', icon){
    const map = { crit:'alert-octagon', warn:'alert-triangle', ok:'check-circle-2', info:'info', ai:'sparkles' };
    const c = sev==='ai' ? 'var(--violet)' : this.sevColor(sev);
    const bg = sev==='ai' ? 'rgba(139,92,246,.16)' : this.sevSoft(sev);
    const box = document.createElement('div');
    box.className = 'toast';
    box.style.setProperty('--tc', c);
    box.style.setProperty('--tbg', bg);
    box.innerHTML = `
      <div class="toast-ico"><i data-lucide="${icon || map[sev] || 'info'}"></i></div>
      <div class="grow"><h5>${title}</h5><p>${msg}</p></div>
      <button class="btn btn-icon btn-sm btn-ghost" onclick="this.closest('.toast').remove()">
        <i data-lucide="x"></i></button>
      <div class="prog"></div>`;
    UI.el('#toasts').appendChild(box);
    UI.icons();
    setTimeout(()=>{ box.classList.add('out'); setTimeout(()=>box.remove(), 380); }, 5400);
  },

  /* ---- Overlay de processamento da IA ---- */
  aiRun(container, steps, done, totalMs=2600){
    const ov = document.createElement('div');
    ov.className = 'ai-overlay on';
    ov.innerHTML = `
      <div class="ai-load">
        <div class="ring"><i><i data-lucide="brain-circuit"></i></i></div>
        <h4 class="gradient-text">Motor de IA processando</h4>
        <p id="aiPhrase">${steps[0]}</p>
        <div class="ai-steps">
          ${steps.map((s,i)=>`<div class="ai-step" data-i="${i}">
            <i data-lucide="${i===0?'loader':'circle'}"></i><span>${s}</span></div>`).join('')}
        </div>
      </div>`;
    container.style.position = 'relative';
    container.appendChild(ov);
    UI.icons();

    const stepEls = UI.els('.ai-step', ov);
    // O Lucide troca <i data-lucide> por <svg>; para reatribuir o ícone
    // é preciso recriar o <i> em vez de alterar o elemento existente.
    const setIcone = (host, nome)=>{
      const atual = host.querySelector('i,svg'); if (!atual) return;
      const novo = document.createElement('i');
      novo.setAttribute('data-lucide', nome);
      atual.replaceWith(novo);
    };
    const per = totalMs / steps.length;
    steps.forEach((s,i)=>{
      setTimeout(()=>{
        stepEls.forEach((e,j)=>{
          e.classList.toggle('on', j===i);
          if (j<i && !e.classList.contains('done')){ e.classList.add('done'); setIcone(e,'check'); }
        });
        const p = UI.el('#aiPhrase', ov); if (p) p.textContent = s;
        UI.icons();
      }, per*i);
    });
    setTimeout(()=>{
      stepEls.forEach(e=>{ if(!e.classList.contains('done')){ e.classList.add('done'); setIcone(e,'check'); } });
      UI.icons();
      setTimeout(()=>{ ov.remove(); done && done(); }, 380);
    }, totalMs);
  },

  /* ---- Contador animado ---- */
  countTo(node, to, dur=1100, fmt=(v)=>UI.nb(Math.round(v))){
    const from = 0, t0 = performance.now();
    const tick = (t)=>{
      const p = Math.min(1,(t-t0)/dur);
      const e = 1 - Math.pow(1-p, 3);
      node.textContent = fmt(from + (to-from)*e);
      if (p<1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  },

  /* ---- Sparkline SVG ---- */
  spark(data, color, id){
    const w=240, h=34, min=Math.min(...data), max=Math.max(...data), rng=(max-min)||1;
    const pts = data.map((v,i)=>[ (i/(data.length-1))*w, h - ((v-min)/rng)*(h-6) - 3 ]);
    const path = pts.map((p,i)=> (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const area = path + ` L${w} ${h} L0 ${h} Z`;
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:100%">
      <defs><linearGradient id="sg${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity=".38"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#sg${id})"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="2.8" fill="${color}"/>
    </svg>`;
  },

  /* ---- Card de KPI ---- */
  kpiCard(k, i){
    const arrow = k.dir==='up' ? 'trending-up' : k.dir==='down' ? 'trending-down' : 'minus';
    const tclass = k.dir==='flat' ? 't-flat' : (k.dir==='up' || k.good) ? 't-up' : 't-down';
    return `<div class="kpi" style="--kpi-glow:${k.glow};--kpi-c:${k.c};--kpi-bg:${k.c}22;--kpi-bd:${k.c}44">
      <div class="kpi-top">
        <div class="kpi-lbl">${k.label}</div>
        <div class="kpi-ico"><i data-lucide="${k.icon}"></i></div>
      </div>
      <div class="kpi-val"><span data-count="${k.id}">${k.val}</span>${k.unit?`<small>${k.unit}</small>`:''}</div>
      <div class="kpi-sub">
        <span class="trend ${tclass}"><i data-lucide="${arrow}"></i>${k.trend}</span>
        <span style="opacity:.4">·</span><span>${k.sub}</span>
      </div>
      <div class="spark">${UI.spark(k.spark, k.c, i)}</div>
    </div>`;
  },

  /* ---- Card de insight de IA ---- */
  insightCard(o){
    const c = UI.sevColor(o.sev);
    return `<div class="insight" style="--ic:${c};--ic-bg:${UI.sevSoft(o.sev)};--ic-bd:${c}44"
              onclick="App.openInsight('${encodeURIComponent(JSON.stringify(o))}')">
      <div class="insight-ico"><i data-lucide="${o.icon}"></i></div>
      <div class="grow" style="min-width:0">
        <h4>${o.title}
          <span class="badge b-brand" style="height:18px;font-size:9.5px">
            <i data-lucide="sparkles"></i>${o.conf}% confiança</span>
        </h4>
        <p>${o.txt}</p>
        <div class="impact">
          <span class="badge ${UI.sevBadge(o.sev)}"><i data-lucide="banknote"></i>${o.impact}</span>
          <span class="tiny dim row" style="gap:5px"><i data-lucide="wand-2" style="width:11px;height:11px"></i>${o.action}</span>
        </div>
      </div>
      <i data-lucide="chevron-right" style="width:15px;height:15px;opacity:.35;flex:none;margin-top:8px"></i>
    </div>`;
  },

  /* ---- Anel de KPI (gauge) ---- */
  ring(pct, label, color='var(--brand)', sublabel=''){
    const r=48, c=2*Math.PI*r, off=c*(1-pct/100);
    return `<div class="ring-kpi">
      <svg viewBox="0 0 118 118" width="118" height="118">
        <circle cx="59" cy="59" r="${r}" fill="none" stroke="var(--panel-2)" stroke-width="9"/>
        <circle cx="59" cy="59" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${c}" stroke-dashoffset="${c}"
          style="transition:stroke-dashoffset 1.4s var(--ease)" data-ring="${off}"/>
      </svg>
      <div class="val"><b>${label}</b><span>${sublabel}</span></div>
    </div>`;
  },
  animateRings(root=document){
    UI.els('[data-ring]', root).forEach(c=>{
      setTimeout(()=>{ c.style.strokeDashoffset = c.dataset.ring; }, 120);
    });
  },
  animateBars(root=document){
    UI.els('.bar > i[data-w]', root).forEach(b=>{
      setTimeout(()=>{ b.style.width = b.dataset.w + '%'; }, 140);
    });
  },

  /* ---- Mapa do Brasil (SVG vetorial próprio) ---- */
  BR_PATH: 'M555 40 L575 62 L590 95 L578 128 L556 150 L540 132 L520 128 L495 140 L470 132 L440 118 L405 108 L372 96 L345 74 L333 22 L300 42 L262 62 L215 86 L168 104 L128 116 L105 125 L100 168 L102 212 L100 255 L74 282 L44 308 L14 330 L3 340 L20 372 L28 388 L72 392 L120 394 L168 394 L218 396 L252 420 L288 452 L318 470 L340 490 L352 528 L370 560 L390 592 L405 625 L408 664 L410 703 L440 740 L466 768 L485 790 L462 812 L430 838 L418 872 L410 905 L440 932 L478 960 L515 993 L548 962 L575 928 L600 900 L620 872 L638 840 L662 818 L682 806 L693 798 L722 788 L748 780 L770 775 L792 742 L812 706 L830 678 L843 658 L858 610 L872 560 L882 512 L888 475 L905 440 L930 400 L955 372 L978 350 L980 322 L970 295 L945 272 L912 254 L888 243 L850 232 L810 224 L775 220 L743 213 L706 202 L672 194 L638 185 L610 176 L588 163 L570 140 L558 108 Z',

  mapSVG(opts={}){
    const { nodes=DB.cidades, flows=DB.fluxos, showFlows=true, showHeat=false, showLabels=true, id='map' } = opts;
    const colorOf = s => s==='crit' ? '#F43F5E' : s==='warn' ? '#F59E0B' : '#22D3EE';

    const flowPaths = showFlows ? flows.map((f,i)=>{
      const a=DB.cidadeMap[f[0]], b=DB.cidadeMap[f[1]]; if(!a||!b) return '';
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      const dx=b.x-a.x, dy=b.y-a.y, curve=0.22;
      const cx=mx - dy*curve, cy=my + dx*curve;
      return `<path class="flow-line" d="M${a.x} ${a.y} Q${cx} ${cy} ${b.x} ${b.y}"
        stroke="url(#flowGrad${id})" stroke-width="${0.7+f[2]*0.22}"/>
        <path class="route-line" d="M${a.x} ${a.y} Q${cx} ${cy} ${b.x} ${b.y}"
        stroke="rgba(34,211,238,.75)" stroke-width="1.3" style="animation-delay:${i*.14}s"/>`;
    }).join('') : '';

    const heat = showHeat ? nodes.map(c=>`
      <circle cx="${c.x}" cy="${c.y}" r="${18 + c.v/8}" fill="url(#heatGrad${id})" opacity="${.2+Math.min(.55,c.v/520)}"/>
    `).join('') : '';

    const pts = nodes.map(c=>{
      const col = colorOf(c.st);
      const r = c.tipo==='hub' ? 9 : c.tipo==='cd' ? 6.5 : 5;
      return `<g class="node" data-tip="${c.n} · ${c.v} embarques/dia" onclick="UI.toast('${c.n}','${c.v} embarques ativos · ${c.tipo.toUpperCase()} · status ${c.st==='ok'?'normal':c.st==='warn'?'atenção':'crítico'}','${c.st==='ok'?'ok':c.st}')">
        <circle class="pulse-ring" cx="${c.x}" cy="${c.y}" r="${r+4}" fill="none" stroke="${col}" stroke-width="1.5" opacity=".8"/>
        <circle class="core" cx="${c.x}" cy="${c.y}" r="${r}" fill="${col}" stroke="rgba(255,255,255,.9)" stroke-width="1.6"/>
        ${c.tipo==='hub' ? `<circle cx="${c.x}" cy="${c.y}" r="${r+9}" fill="none" stroke="${col}" stroke-width="1" opacity=".45"/>`:''}
        ${showLabels && (c.tipo!=='filial') ? `<text x="${c.x+12}" y="${c.y+4}">${c.n}</text>` : ''}
      </g>`;
    }).join('');

    return `<svg class="br-map" viewBox="0 0 1010 1010" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="flowGrad${id}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#6366F1" stop-opacity=".85"/>
          <stop offset="100%" stop-color="#22D3EE" stop-opacity=".35"/>
        </linearGradient>
        <radialGradient id="heatGrad${id}">
          <stop offset="0%" stop-color="#F43F5E" stop-opacity=".85"/>
          <stop offset="45%" stop-color="#F59E0B" stop-opacity=".45"/>
          <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
        </radialGradient>
        <filter id="glow${id}"><feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <path class="br-land" d="${UI.BR_PATH}"/>
      ${heat}
      <g filter="url(#glow${id})">${flowPaths}</g>
      ${pts}
    </svg>`;
  },

  /* ---- Configuração base do Chart.js ---- */
  chartDefaults(){
    Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
    Chart.defaults.font.size = 11;
    Chart.defaults.color = UI.css('--txt-dim');
    Chart.defaults.plugins.legend.labels.usePointStyle = true;
    Chart.defaults.plugins.legend.labels.boxWidth = 7;
    Chart.defaults.plugins.legend.labels.padding = 15;
    Chart.defaults.plugins.tooltip.backgroundColor = UI.isDark() ? 'rgba(12,16,29,.96)' : 'rgba(255,255,255,.98)';
    Chart.defaults.plugins.tooltip.titleColor = UI.css('--txt');
    Chart.defaults.plugins.tooltip.bodyColor = UI.css('--txt-2');
    Chart.defaults.plugins.tooltip.borderColor = UI.css('--stroke-2');
    Chart.defaults.plugins.tooltip.borderWidth = 1;
    Chart.defaults.plugins.tooltip.padding = 11;
    Chart.defaults.plugins.tooltip.cornerRadius = 9;
    Chart.defaults.plugins.tooltip.displayColors = true;
    Chart.defaults.plugins.tooltip.boxPadding = 5;
  },
  _charts: {},
  chart(id, cfg){
    const cv = document.getElementById(id); if(!cv) return;
    if (UI._charts[id]) UI._charts[id].destroy();
    const grid = UI.css('--chart-grid');
    // Aplica grid/ticks padronizados
    if (cfg.options?.scales){
      for (const k in cfg.options.scales){
        const s = cfg.options.scales[k];
        s.grid = Object.assign({ color: grid, drawTicks:false, borderColor:'transparent' }, s.grid||{});
        s.ticks = Object.assign({ padding:8 }, s.ticks||{});
        s.border = { display:false };
      }
    }
    cfg.options = Object.assign({ responsive:true, maintainAspectRatio:false,
      animation:{ duration:1050, easing:'easeOutQuart' },
      interaction:{ mode:'index', intersect:false } }, cfg.options||{});
    UI._charts[id] = new Chart(cv, cfg);
    return UI._charts[id];
  },
  grad(ctx, c1, c2, h=260){
    const g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0, c1); g.addColorStop(1, c2); return g;
  },
  destroyCharts(){ Object.values(UI._charts).forEach(c=>c.destroy()); UI._charts = {}; },

  /* ---- Cabeçalho de página ---- */
  pageHead(title, sub, actions='', icon=''){
    return `<div class="page-h">
      <div>
        <h1>${icon?`<span class="logo-mark" style="width:34px;height:34px;border-radius:11px"><i data-lucide="${icon}"></i></span>`:''}${title}</h1>
        <p>${sub}</p>
      </div>
      <div class="page-actions">${actions}</div>
    </div>`;
  },
};
</script>


<script>
/* ══════════════════════════════════════════════
   CAMADA 3 · VIEWS — uma tela por módulo
   Cada view expõe: title, mod, render(), mount()
   ══════════════════════════════════════════════ */
const Views = {};

/* ══════════════════════════════════════════════════════════════
   1 · DASHBOARD EXECUTIVO
   ══════════════════════════════════════════════════════════════ */
Views.dashboard = {
  title:'Dashboard Executivo', mod:'Comando',

  render(){
    const kpis = DB.kpis.map((k,i)=>UI.kpiCard(k,i)).join('');
    const insights = DB.insights.slice(0,4).map(o=>UI.insightCard(o)).join('');
    const alertas = DB.alertas.map(a=>`
      <div class="row" style="padding:11px 0;border-bottom:1px solid var(--stroke);gap:12px">
        <span class="dot dot-${a.sev} ${a.sev==='crit'?'dot-live':''}"></span>
        <div class="grow" style="min-width:0">
          <div style="font-size:12.6px;font-weight:600">${a.t}</div>
          <div class="tiny dim" style="margin-top:2px">${a.d}</div>
        </div>
        <span class="badge ${UI.sevBadge(a.sev)}"><i data-lucide="timer"></i>${a.min} min</span>
      </div>`).join('');

    // Heatmap logístico: 7 dias × 12 faixas horárias
    const dias = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
    const seed = (d,h)=>{
      const base = Math.sin(d*3.7 + h*1.9) * 43758.5453;
      let v = (base - Math.floor(base));
      const peak = 1 - Math.abs(h-5.2)/8;           // pico entre 10h e 13h
      const week = d>=5 ? .42 : 1;                   // fim de semana mais fraco
      return Math.max(.04, Math.min(1, (v*.42 + peak*.72) * week));
    };
    const heatCells = dias.map((d,di)=>{
      const row = Array.from({length:12}, (_,h)=>{
        const v = seed(di,h);
        const col = v>.8 ? '244,63,94' : v>.62 ? '245,158,11' : v>.4 ? '99,102,241' : '34,211,238';
        return `<div class="heat-cell" style="background:rgba(${col},${(.14+v*.8).toFixed(2)})"
          data-tip="${d} · ${String(7+h).padStart(2,'0')}h · ocupação ${(v*100).toFixed(0)}%"></div>`;
      }).join('');
      return `<div class="heat-lbl">${d}</div>${row}`;
    }).join('');

    return `
    ${UI.pageHead('Dashboard Executivo',
      `Visão consolidada da operação · ${DB.empresa.nome} · ${DB.empresa.cd} · atualizado há 34 segundos`,
      `<div class="seg" id="segPeriodo">
         <button>Hoje</button><button class="on">Mês</button><button>Trimestre</button><button>YTD</button>
       </div>
       <button class="btn" onclick="UI.toast('Relatório em preparação','O fechamento executivo será enviado para ricardo.alencar@meridiano.com.br em instantes.','info','file-down')">
         <i data-lucide="download"></i>Exportar</button>
       <button class="btn btn-ai" onclick="Views.dashboard.reanalyze()">
         <i data-lucide="sparkles"></i>Reanalisar com IA</button>`)}

    <div class="grid" style="gap:18px">

      <!-- Faixa de inteligência -->
      <div class="ai-strip" id="aiHero">
        <div class="ai-strip-in">
          <div class="ai-orb lg"><i data-lucide="brain-circuit"></i></div>
          <div class="grow" style="min-width:260px">
            <div class="ai-title">
              Briefing da IA · <span class="gradient-text">quinta-feira, 31 de julho · 10:47</span>
              <span class="badge b-brand"><i data-lucide="activity"></i>1.284.902 eventos analisados</span>
            </div>
            <div class="ai-body">
              Bom dia, Ricardo. A operação está <b>estável com 3 pontos de atenção</b>.

    const H0=6, H1=20, span=H1-H0;
    const rows = DB.docasAgenda.map((d,di)=>{
      const slots = d.slots.map((s,si)=>{
        const left = ((s.ini-H0)/span)*100, width = ((s.fim-s.ini)/span)*100;
        const st = this.slotStyle(s.st);
        const fmt = h => String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round((h%1)*60)).padStart(2,'0');
        return `<div class="slot" data-d="${di}" data-s="${si}" draggable="true"
            style="left:${left}%;width:${width}%;--sl-bg:${st.bg};--sl-bd:${st.bd}"
            data-tip="${s.transp} · ${s.carga} · ${fmt(s.ini)}–${fmt(s.fim)}">
          <b>${s.veic} · ${s.carga}</b><span>${fmt(s.ini)}–${fmt(s.fim)} · ${s.transp}</span>
        </div>`;
      }).join('');
      const tipoBadge = d.tipo==='Recebimento' ? 'b-info' : d.tipo==='Expedição' ? 'b-brand' : 'b-ok';
      return `<div class="gantt-row">
        <div class="gantt-lbl">
          <strong>${d.doca}</strong>
          <div class="row" style="gap:5px">
            <span class="badge ${tipoBadge}" style="height:17px;font-size:9.5px">${d.tipo}</span>

          </div>
        </div>
        <div class="gantt-track">${slots}</div>
      </div>`;
    }).join('');

    const hours = Array.from({length:span},(_,i)=>`<span>${String(H0+i).padStart(2,'0')}:00</span>`).join('');
    const nowPct = ((10.78-H0)/span)*100;
    return `<div class="gantt"><div class="gantt-inner">
      <div class="gantt-head"><div style="padding:9px 12px" class="up">Doca</div><div class="gantt-hours">${hours}</div></div>
      <div style="position:relative">
        ${rows}

    });
    this.enableDrag();

  /* Drag-and-drop simulado dos blocos da agenda */
  enableDrag(){
    let dragged = null, startX = 0, startLeft = 0;
    UI.els('.slot').forEach(s=>{
      s.addEventListener('pointerdown', e=>{
        dragged = s; startX = e.clientX; startLeft = parseFloat(s.style.left);
        s.style.transition = 'none'; s.style.zIndex = 20; s.setPointerCapture(e.pointerId);
      });
      s.addEventListener('pointermove', e=>{
        if (dragged !== s) return;
        const track = s.parentElement.getBoundingClientRect();
        const delta = ((e.clientX - startX) / track.width) * 100;
        s.style.left = Math.max(0, Math.min(100 - parseFloat(s.style.width), startLeft + delta)) + '%';
      });
      s.addEventListener('pointerup', e=>{
        if (dragged !== s) return;
        s.style.transition = ''; s.style.zIndex = '';
        const moved = Math.abs(parseFloat(s.style.left) - startLeft) > 0.6;
        dragged = null;
        if (moved){
          s.classList.add('moved');
          setTimeout(()=>s.classList.remove('moved'), 1700);
          const hora = 6 + (parseFloat(s.style.left)/100)*14;
          const hh = String(Math.floor(hora)).padStart(2,'0') + ':' + String(Math.round((hora%1)*60)).padStart(2,'0');
          UI.toast('Janela reprogramada',
            `Novo início às <b>${hh}</b>. A IA revalidou a agenda: <b>sem conflitos</b>, aderência mantida em 94,1% e nenhuma janela contratual violada.`, 'ai');
        }
      });
    });
  },

  otimizar(){

      this.otimizado = true;
      // Reposiciona blocos planejados para janelas ociosas
      UI.els('#ganttHolder .slot').forEach((s,i)=>{
        const bg = s.style.getPropertyValue('--sl-bg');
        if (bg.includes('99,102,241') || bg.includes('244,63,94')){
          const cur = parseFloat(s.style.left);
          const shift = ((i % 3) + 1) * 2.6 + (bg.includes('244,63,94') ? 4.2 : 0);
          s.style.left = Math.min(92, cur + shift) + '%';
          s.style.setProperty('--sl-bg','rgba(16,185,129,.22)');
          s.style.setProperty('--sl-bd','rgba(16,185,129,.5)');
          s.classList.add('moved');
        }
      });
      UI.el('#resultOtim').style.display = '';
      UI.el('#resultOtim').scrollIntoView({behavior:'smooth', block:'nearest'});
      UI.el('#kEspera').innerHTML = '38,5<small>min</small>';
      UI.el('#kEsperaTrend').innerHTML = '<i data-lucide="trending-down"></i>-18,0%';
      UI.el('#kEsperaTrend').className = 'trend t-up';
      UI.el('#kAder').innerHTML = '94,1<small>%</small>';
      UI.el('#docaAIText').innerHTML = `Otimização aplicada com sucesso. <b>11 janelas foram reprogramadas</b> e os 3 conflitos foram resolvidos.
        O tempo médio de espera caiu de 47 para <span class="hi">38,5 minutos (-18%)</span>, três docas foram liberadas no horário de pico
        e a aderência à janela subiu para 94,1%. Ganho projetado: <span class="money">R$ 41.200/mês</span> em custo de permanência.`;
      UI.icons();
      UI.toast('Tempo médio reduzido em 18%','Agenda reotimizada: 47 min → 38,5 min. Economia projetada de R$ 41.200/mês.','ok','sparkles');
      setTimeout(()=>UI.toast('Notificações enviadas','23 motoristas e 8 transportadoras receberam as novas janelas por WhatsApp e EDI.','info','send'), 1400);
    }, 3200);
  },

  repriorizar(){
    UI.toast('Fila repriorizada pela IA','RJK1V52 (Vitória Insumos) promovido para a Doca 9, ociosa há 41 min. Espera do pátio cai de 47 para 33 minutos.','ai');
  },
};
</script>

  mount(){ UI.animateBars(); },

  otimizar(){
    if (this.otimizado){ UI.toast('Rotas já otimizadas','O plano atual é a melhor solução para as restrições vigentes.','info','check'); return; }
    UI.aiRun(UI.el('#mapaRotas'), [
      'Carregando 87 paradas e 8 veículos disponíveis…',
      'Consultando tráfego ao vivo e previsão de 6 horas…',
      'Aplicando restrições de circulação em 14 municípios…',
      'Resolvendo VRP com janelas de tempo (2,4 M de iterações)…',
      'Validando custo, jornada do motorista e ocupação…',
    ], ()=>{
      this.otimizado = true;
      // Anima o mapa para novo traçado
      UI.el('#routeMap').innerHTML = UI.mapSVG({ id:'rt2', flows: DB.fluxos.filter((_,i)=>i%4!==3) });
      UI.icons();
      // Atualiza a tabela com os valores otimizados
      DB.rotas.forEach(r=>{
        const km = document.querySelector(`[data-km="${r.id}"]`);
        const cu = document.querySelector(`[data-custo="${r.id}"]`);
        const tp = document.querySelector(`[data-tempo="${r.id}"]`);
        const st = document.querySelector(`[data-st="${r.id}"]`);
        const ec = document.querySelector(`[data-eco="${r.id}"]`);
        if (km){ km.textContent = r.kmOpt; km.style.color = 'var(--ok)'; }
        if (cu){ cu.textContent = UI.brl(r.custoOpt); cu.style.color = 'var(--ok)'; }
        if (tp){ tp.textContent = r.tempoOpt; tp.style.color = 'var(--ok)'; }
        if (st){ st.textContent = 'otimizada'; st.className = 'badge b-ok'; }
        if (ec){ ec.style.transition = 'opacity .6s var(--ease)'; ec.style.opacity = 1; }
      });
      const total = DB.rotas.reduce((a,r)=>a+r.custoOpt,0);
      UI.el('#custoTotal').textContent = UI.brl(total);
      UI.el('#custoTotal').style.color = 'var(--ok)';
      const et = UI.el('#ecoTotal'); et.style.transition='opacity .6s var(--ease)'; et.style.opacity = 1;
      UI.el('#rotaAIText').innerHTML = `<b>Reotimização concluída.</b> As 8 rotas foram recalculadas e 3 sequenciamentos foram corrigidos.
        A quilometragem caiu de 5.900 para <span class="hi">5.479 km (-7,1%)</span> e o custo diário do plano caiu
        <span class="money">${UI.brl(DB.rotas.reduce((a,r)=>a+(r.custo-r.custoOpt),0))}</span>.
        Projetado no mês: <span class="money">R$ 84.000</span>, <span class="hi">-12% de combustível</span> e <span class="hi">+8% de produtividade</span>.
        Nenhuma janela contratual foi violada e todas as jornadas respeitam a Lei do Motorista.`;
      UI.toast('Rotas otimizadas','Economia de R$ 84.000/mês · -12% combustível · +8% produtividade.','ok','route');
      setTimeout(()=>UI.toast('Planos enviados','8 roteiros publicados no TMS Roadmap e sincronizados com os apps dos motoristas.','info','send'), 1500);
    }, 3400);
  },

  detalhe(id){
    const r = DB.rotas.find(x=>x.id===id); if(!r) return;
    App.drawer(`Rota ${r.id}`, r.nome, `
      <div class="grid g2" style="gap:13px;margin-bottom:20px">
        ${[['Veículo',r.veic],['Motorista',r.mot],['Paradas',r.paradas],['Ocupação',r.occ+'%'],
           ['Distância',r.km+' km'],['Distância otimizada',r.kmOpt+' km'],
           ['Custo atual',UI.brl(r.custo)],['Custo otimizado',UI.brl(r.custoOpt)]]
          .map(([k,v])=>`<div style="padding:13px 15px;border-radius:13px;background:var(--panel);border:1px solid var(--stroke)">
            <div class="tiny dim">${k}</div><div class="num" style="font-size:15px;font-weight:700;margin-top:3px">${v}</div></div>`).join('')}
      </div>
      <div class="ai-strip"><div class="ai-strip-in">
        <div class="ai-orb"><i data-lucide="sparkles"></i></div>
        <div class="grow">
          <div class="ai-title">Análise da rota</div>
          <div class="ai-body">O sequenciamento atual gera <b>${r.km - r.kmOpt} km improdutivos</b> por sobreposição de dois trechos.
            Reordenando as paradas 4, 7 e 9 e antecipando a saída em 25 minutos, o ciclo cai de ${r.tempo} para <span class="hi">${r.tempoOpt}</span>
            e o custo recua <span class="money">${UI.brl(r.custo - r.custoOpt)}</span> por viagem.</div>
        </div>
      </div></div>
      <h4 style="margin:22px 0 12px;font-size:13px">Sequência de paradas</h4>
      <div class="col" style="gap:9px">
        ${Array.from({length:Math.min(6,r.paradas)},(_,i)=>`
          <div class="queue-item"><div class="q-pos ${i===0?'p1':''}">${i+1}</div>
            <div class="grow"><div style="font-size:12.4px;font-weight:600">${['Centro de Distribuição Cajamar','Cliente Ambev · Jaguariúna','Cliente Nestlé · Caçapava','Cliente Raízen · Piracicaba','Cliente Suzano · Limeira','Cliente Bunge · Rio Claro'][i]}</div>
              <div class="tiny dim">Janela ${['05:30','08:00','10:15','12:40','14:20','16:05'][i]} · ${[0,64,112,68,44,52][i]} km do ponto anterior</div></div>
            <span class="badge ${i<2?'b-ok':'b-brand'}">${i<2?'concluída':'planejada'}</span>
          </div>`).join('')}
      </div>`,
      `<button class="btn" onclick="App.closeDrawer()">Fechar</button>
       <button class="btn btn-ai" onclick="App.closeDrawer();Views.rotas.otimizar()"><i data-lucide="wand-2"></i>Otimizar esta rota</button>`);
  },
};
</script>

          <div class="kpi-top"><div class="kpi-lbl">${l}</div><div class="kpi-ico"><i data-lucide="${i}"></i></div></div>
          <div class="kpi-val" style="font-size:25px">${v}</div>

               ['Emissão de CO₂','9,8 t/dia',88,'crit'],['Km rodados','5.900 km',92,'warn']]
              .map(([k,v,p,c])=>`<div>

          <div class="truck-viz" style="margin-bottom:18px" id="truckAfter">
            ${Array.from({length:15},(_,i)=>`<div class="truck-i ${i<11?'saved':'removed'}"><i data-lucide="truck"></i></div>`).join('')}
          </div>
          <div class="col" style="gap:13px">
            ${[['Ocupação média','87,2%',87.2,'ok'],['Custo diário do plano','R$ 30.560',79,'ok'],

    if (!texto) input.value = '';
    const log = UI.el('#chatLog');

    log.insertAdjacentHTML('beforeend', `
      <div class="msg me"><div class="msg-av me">RA</div><div class="bubble">${txt}</div></div>`);
    log.scrollTop = log.scrollHeight;

    const tid = 'typing' + Date.now();
    log.insertAdjacentHTML('beforeend', `
      <div class="msg" id="${tid}"><div class="msg-av ai"><i data-lucide="brain-circuit"></i></div>
        <div class="bubble typing"><i></i><i></i><i></i></div></div>`);
    UI.icons();
    log.scrollTop = log.scrollHeight;

    setTimeout(()=>{
      const r = this.responder(txt);
      document.getElementById(tid)?.remove();
      log.insertAdjacentHTML('beforeend', `
        <div class="msg"><div class="msg-av ai"><i data-lucide="brain-circuit"></i></div>
          <div class="bubble">${r.html}

      UI.icons();
      log.scrollTop = log.scrollHeight;
    }, 1500);
  },
